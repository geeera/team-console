# Team Console runner on GitHub Actions (#671, #712; ADR 0008 decision 7(a′); threat model C11).
#
# Copy this file unchanged to `.github/workflows/team-console-runner.yml` on the default branch of the project's
# repository. The console starts it with `workflow_dispatch` for one queued job and checks the run's OIDC token against
# this exact path, the default branch and the `team-console` Environment, so a renamed or edited copy elsewhere is
# refused. Setup, costs and limits: docs/runbooks/runner.md › «GitHub Actions».
#
# Why it looks the way it does:
# - The only input is the job id, validated against the ULID pattern and read through `env:`, never interpolated
#   into a script. No secret is ever an input.
# - No `uses:` step at all, so no `actions/checkout`, `actions/cache` or artifact upload. A JavaScript action receives
#   the run's `ACTIONS_RUNTIME_TOKEN` (it writes the repository's Actions cache), and its post step would run after the
#   job from files the job can change. Without one, that token never leaves the Actions runner's own process (#712).
#   The runner clones the repository itself with `github.token` (`contents: read`), which dies with the run.
# - Root is given up before anything third-party runs: sudo, the Docker socket (the `docker` group is root) and ptrace
#   of other processes. The job then runs as the VM's unprivileged user and cannot read the Actions runner's memory.
# - Node.js, the runner release and the Claude Code CLI are each pinned and checked before use: the runner tarball
#   with `gh attestation verify` against this product's release workflow and tag, the other two by checksum.
# - The OIDC request token reaches the runner on stdin, so the process that supervises the job never holds it in its
#   environment, and the runner starts with SIGUSR1 off, so the job cannot open its Node inspector.
name: team-console-runner

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Team Console job id (the console sets it)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  run:
    name: Team Console job
    # GitHub-hosted only: the console refuses a token from a self-hosted runner (`runner_environment`).
    runs-on: ubuntu-24.04
    environment: team-console
    # GitHub's limit for a hosted job; the runner itself stops the job at its own `maxMinutes`.
    timeout-minutes: 360
    steps:
      - name: Check the job id
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          if [[ ! "${JOB_ID}" =~ ^[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo '::error::job_id is not a Team Console job id'
            exit 1
          fi

      - name: Give up root for the rest of the run
        run: |
          set -euo pipefail
          # No attaching to another process: without it the job cannot read the Actions runner's memory.
          sudo sysctl -q -w kernel.yama.ptrace_scope=2
          # Members of the `docker` group (this user) are root through the daemon's socket.
          for unit in docker.socket docker.service; do
            if systemctl cat "${unit}" > /dev/null 2>&1; then
              sudo systemctl stop "${unit}"
            fi
          done
          sudo rm -f /var/run/docker.sock /run/docker.sock
          # Every sudo rule goes, whatever file the image keeps it in: a sudoers that admits root only, checked
          # first, then the drop-in directory. This user has no password, so nothing admits it afterwards.
          sudo sh -c 'set -eu
            printf "%s\n" "Defaults env_reset" "root ALL=(ALL:ALL) ALL" > /etc/sudoers.team-console
            chmod 0440 /etc/sudoers.team-console
            visudo -cq -f /etc/sudoers.team-console
            rm -rf /etc/sudoers.d
            mv -f /etc/sudoers.team-console /etc/sudoers'

      - name: Check that root is gone
        run: |
          set -euo pipefail
          if sudo -n true 2> /dev/null; then
            echo '::error::sudo still works'
            exit 1
          fi
          if [[ -e /var/run/docker.sock || -e /run/docker.sock ]]; then
            echo '::error::the Docker socket is still there'
            exit 1
          fi
          if [[ "$(cat /proc/sys/kernel/yama/ptrace_scope)" != 2 ]]; then
            echo '::error::kernel.yama.ptrace_scope is not 2'
            exit 1
          fi
          if [[ "$(id -u)" == 0 ]]; then
            echo '::error::the job would run as root'
            exit 1
          fi

      - name: Install Node.js
        env:
          NODE_VERSION: 22.23.5
          # SHASUMS256.txt of that release, node-v22.23.5-linux-x64.tar.xz
          NODE_SHA256: cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/node.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "${archive}" \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  ${archive}" | sha256sum --check --strict --quiet
          install -d -m 0700 "${RUNNER_TEMP}/node"
          tar -xJf "${archive}" --no-same-owner --strip-components=1 -C "${RUNNER_TEMP}/node"
          rm -f "${archive}"
          test "$("${RUNNER_TEMP}/node/bin/node" --version)" = "v${NODE_VERSION}"

      - name: Download and verify the runner
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_VERSION: 0.1.0
        run: |
          set -euo pipefail
          download="${RUNNER_TEMP}/runner-download"
          tarball="team-console-runner-${RUNNER_VERSION}-linux-x64.tar.gz"
          install -d -m 0700 "${download}" "${RUNNER_TEMP}/runner"
          gh release download "v${RUNNER_VERSION}" --repo github.com/geeera/team-console --pattern "${tarball}" --dir "${download}"
          gh attestation verify "${download}/${tarball}" --hostname github.com --repo geeera/team-console --signer-workflow github.com/geeera/team-console/.github/workflows/release-runner.yml --source-ref "refs/tags/v${RUNNER_VERSION}" --cert-oidc-issuer https://token.actions.githubusercontent.com --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
          tar -xzf "${download}/${tarball}" --no-same-owner -C "${RUNNER_TEMP}/runner"
          (cd "${RUNNER_TEMP}/runner" && sha256sum --check --strict --quiet SHA256SUMS)
          rm -rf "${download}"
          test "$(PATH="${RUNNER_TEMP}/node/bin:/usr/bin:/bin" "${RUNNER_TEMP}/runner/bin/team-console-runner" version)" = "${RUNNER_VERSION}"

      - name: Install the Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: 2.1.325
          # The registry's `dist.integrity` of @anthropic-ai/claude-code-linux-x64 at that version, as hex.
          CLAUDE_CODE_SHA512: 06a67332f3ffce02cb2f7e12fbb3b36c6f9cca8169ee0c161d4e64a15c2cc8c953033fb4cd90266d8f94933bed376457c69e8070c7a76d8223409c685df518df
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/claude-code.tgz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "${archive}" \
            "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz"
          echo "${CLAUDE_CODE_SHA512}  ${archive}" | sha512sum --check --strict --quiet
          install -d -m 0700 "${RUNNER_TEMP}/claude-code"
          tar -xzf "${archive}" --no-same-owner --strip-components=1 -C "${RUNNER_TEMP}/claude-code" package/claude
          rm -f "${archive}"

      # Last step: nothing runs on this VM after the job.
      - name: Run the job
        env:
          TC_JOB_ID: ${{ inputs.job_id }}
          TC_CONSOLE_URL: ${{ vars.TC_CONSOLE_URL }}
          TC_CONSOLE_AUDIENCE: ${{ vars.TC_CONSOLE_AUDIENCE }}
          TC_INFERENCE_API_KEY: ${{ secrets.TC_INFERENCE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${TC_INFERENCE_API_KEY}" =~ ^[[:graph:]]+$ ]]; then
            echo '::error::TC_INFERENCE_API_KEY is missing or not one key; set it as a secret of the team-console Environment'
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo '::error::no OIDC request token; the workflow needs permissions: id-token: write'
            exit 1
          fi
          # Defence in depth only: GitHub masks secrets already, and a compromised job can still encode or send the key.
          echo "::add-mask::${TC_INFERENCE_API_KEY}"
          export TC_CLAUDE_COMMAND="${RUNNER_TEMP}/claude-code/claude"
          # The request token goes in on stdin and out of the environment; `exec` leaves no shell holding it either.
          # --disable-sigusr1: the job runs as this uid and could otherwise open the runner's Node inspector with
          # `kill -USR1` and read the token and the job's console identity out of its memory.
          exec env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN NODE_OPTIONS=--disable-sigusr1 PATH="${RUNNER_TEMP}/node/bin:/usr/bin:/bin" \
            "${RUNNER_TEMP}/runner/bin/team-console-runner" run-once --oidc --request-token - \
            <<< "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
