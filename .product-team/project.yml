# The product team's contract for this repository (product-team plugin, reference/stack-contract.md).
name: Team Console
repo: geeera/team-console
mode: new
stack: >
  Nx monorepo — Angular 22 PWA (apps/console, FSD libs), Cloudflare Workers with Hono (apps/api, apps/hooks),
  D1, Cloudflare Access, Playwright. See docs/decisions/0001-stack-and-architecture.md.
decisions_dir: docs/decisions

# Node 22 (.nvmrc) and npm. `e2e` (#14) builds the console and the api, then runs Playwright against a local stack
# per worker (fake GitHub + the api bundle on a fresh local D1); once: `npx playwright install chromium webkit`.
commands:
  install: npm ci
  lint: npx nx run-many -t lint
  test: npx nx run-many -t test
  build: npx nx run-many -t build
  e2e: npx nx e2e console-e2e
  storybook: npx nx build-storybook console-shared-ui

environments:
  dev:
    url: 'https://team-console-dev.geeera.workers.dev'
  stage:
    # team-console-<env>.<account>.workers.dev is deterministic from apps/api/wrangler.jsonc's env.stage.name
    # (ADR 0001 decision 14) — same shape as dev's confirmed URL above. Filled ahead of the first stage
    # deploy (#25); the stage cut (dev -> stage) is what actually makes this URL answer.
    url: 'https://team-console-stage.geeera.workers.dev'
  production:
    url: ''

design:
  tokens:
    - libs/console/shared/ui/src/tokens/tokens.css
  # Cloudflare Pages direct-upload project name from deploy.yml's "Deploy Storybook" step
  # (--project-name=team-console-storybook): <project-name>.pages.dev is deterministic once the project
  # exists (owner checklist step 5). Published from `dev` only (ADR 0001 decision 14).
  storybook_url: 'https://team-console-storybook.pages.dev'

sprint:
  length_days: 14
  freeze_days: 2

caps: {}

review:
  qa: always                 # QA on every PR (owner decision 2026-09-30)
  reviewer: code             # code review only when the PR changes a path below
  code_paths: ["apps/**", "libs/**", "tools/**"]
  max_rework_rounds: 1       # guidance: after one rework round only blockers go back; the rest become follow-ups

team:
  plugin_ref: stable
  reviewer_logins: ['team-console-review[bot]']
  run_log_issue: 22
  # Owner requests to the PM (#219, ADR 0005 decision 2): a request counts only when GitHub says one of these apps
  # posted it (`performed_via_github_app.slug`). The trust root for requests — changing it needs the owner's approval.
  # Dev only (owner decision 2026-10-07 on PR #267): team-console-dev is confirmed by the dev environment's
  # CONSOLE_GITHUB_APP_SLUG variable. team-console-stage and team-console-production are added once the owner has
  # created those apps (#152).
  console_app_slugs: [team-console-dev]

owner:
  language: ru
  timezone: Europe/Kyiv
