# Publishes docs/design (prototypes, wireframes, visual directions) to GitHub Pages after it is merged into dev,
# so designers never push to a publishing branch: designs arrive by PR like everything else.
# Requires two owner settings (.product-team/owner-checklist.md): Settings → Pages → Source: "GitHub Actions"
# (public repositories: free), and Settings → Environments → github-pages → Deployment branches allowing `dev`
# (the default policy allows only gh-pages, so a deploy from dev is rejected).
name: design-pages

on:
  push:
    branches: [dev]
    paths: ["docs/design/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer run queues behind a running one instead of cancelling it: a Pages deploy cut off mid-flight can leave
# the site half-published.
concurrency:
  group: design-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/design
          persist-credentials: false
      - name: Index of every page under docs/design
        run: |
          set -euo pipefail
          cd docs/design
          # fd 3 is the run log: the page body below goes to the index file, the warnings must not.
          exec 3>&1
          {
            echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<title>Designs</title><style>body{font:16px/1.5 system-ui;max-width:640px;margin:32px auto;padding:0 16px}a{display:block;padding:8px 0}</style><h1>Designs</h1>'
            # Names outside the safe charset are skipped, so nothing needs HTML or URL escaping.
            find . -name '*.html' ! -name index.html ! -path './*/src/*' -print0 | sort -z | while IFS= read -r -d '' f; do
              f="${f#./}"
              if [[ "$f" =~ ^[A-Za-z0-9._/-]+$ ]]; then
                echo "<a href=\"$f\">$f</a>"
              else
                echo "::warning::design-pages: skipped file with unsafe name (allowed: A-Z a-z 0-9 . _ / -)" >&3
              fi
            done
          } > "${RUNNER_TEMP}/index.html"
          mv "${RUNNER_TEMP}/index.html" index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/design
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
