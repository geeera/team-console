# The Node.js the runner release ships (#634 PR 5, threat model C11 R-NODE-2): once a week, (1) the pinned
# SHASUMS256.txt still verifies against the committed keyring and the pinned fingerprints, so a release never finds
# out at tag time, and (2) Node has published no security release on the pinned major line after the pinned version.
# A missed one files one `security` finding (never a second while one is open). The fix is an ordinary PR that bumps
# apps/runner/node/node-release.json, then a runner release, and `RUNNER_MINIMUM_VERSION` when the fix matters to the
# runner. Two small downloads (the signed sums and nodejs.org's index.json); no npm, no tarball, no secret.
name: node-runtime-check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: node-runtime-check
  cancel-in-progress: false

env:
  # The same list as release-runner.yml (tools/workspace-checks/src/node-runtime.spec.ts keeps them equal).
  NODE_RELEASE_KEY_FINGERPRINTS: >-
    108F52B48DB57BB0CC439B2997B01419BD92F80A
    5BE8A3F6C8A5C01D106C0AD820B1A390B168D356
    655F3B5C1FB3FA8D1A0CA6BDE4A7D232B936D2FD
    890C08DB8579162FEE0DF9DB8BEAB4DFCF555EF4
    A363A499291CBBC940DD62E41F10027AF002F8B0
    C82FA3AE1CBEDC6BE46B9360C43CEC45C17AB93C
    CC68F5A3106FF448322E48ED27F5E38D5B0A215F
    DD792F5973C6DE52C432CBDAC77ABFA00DDBF2B7

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/runner/node
            tools/release

      - name: The pinned sums still verify
        run: node tools/release/node-runtime.mjs verify-sums

      - name: File a finding for a missed security release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          report=$(node tools/release/node-runtime.mjs security-check)
          pinned=$(jq -r '.pinned' <<<"${report}")
          missed=$(jq -r '.missed | join(", ")' <<<"${report}")
          if [ -z "${missed}" ]; then
            echo "::notice::Node.js ${pinned} has every security release of its line"
            exit 0
          fi
          title_prefix="Bundled Node.js ${pinned} misses security releases"
          open=$(gh issue list --repo "${REPO}" --state open --label security --search "\"${title_prefix}\" in:title" --json number --jq 'length')
          if [ "${open}" != "0" ]; then
            echo "::notice::a finding for Node.js ${pinned} is already open"
            exit 0
          fi
          body=$(printf '%s\n' \
            "Found by \`node-runtime-check.yml\` (threat model C11 R-NODE-2): the runner release ships Node.js ${pinned}, and Node has published the security release(s) ${missed} on that line since." \
            '' \
            "**Fix:** bump \`apps/runner/node/node-release.json\` (version and each platform's sha256 from the signed \`SHASUMS256.txt\`), cut a runner release, and raise \`RUNNER_MINIMUM_VERSION\` if a fix is relevant to the runner. If the release is signed by a key outside \`apps/runner/node/release-keys.asc\`, add the key and its fingerprint in the same PR, with the \`security\` review." \
            '' \
            "Node's notes: https://nodejs.org/en/blog/vulnerability")
          gh issue create --repo "${REPO}" --title "${title_prefix} ${missed}" --label security --label kind:finding --body "${body}"
