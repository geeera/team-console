# Per-environment deploy (plugin reference/deploy-recipes.md, ADR 0001 decision 14): D1 migrations before
# traffic, both Workers, Storybook direct upload from dev, smoke checks, rollback via `workflow_dispatch`
# with a previous ref. `wrangler deploy --dry-run` already runs without secrets inside `nx build api|hooks`
# (see apps/api/project.json, apps/hooks/project.json) — that is the "valid without secrets" half of #7;
# this workflow is the half that needs the real Cloudflare credentials, which is why it is split into two
# jobs (SECURITY/QA review on PR #54):
#
#   `guard` — no `environment:`, no secrets. Resolves which environment this run targets, and for
#   `workflow_dispatch` proves the dispatch was started from that environment's own branch AND that the
#   `ref` input is a commit actually reachable from that branch (a deployment branch policy alone only checks
#   the branch the run was *started* from, never the commit `ref` overrides it with — that gap let any commit
#   reach the deploy credentials). It also refuses to continue if apps/api/wrangler.jsonc or
#   apps/hooks/wrangler.jsonc ever regresses to one of the `00000000-0000-0000-0000-00000000<env-suffix>`
#   scaffold placeholder D1 database ids that shipped before the real ones landed in #25 — a regression guard,
#   not a one-time gate. Cheap: runs before `npm ci`/the build, so a bad id fails in seconds, not after a full
#   Nx build.
#
#   `deploy` — `needs: guard`, so it only starts once every check above passed; `environment:` here is what
#   actually puts GitHub's own deployment-branch policy and (on `production`) required-reviewer gate in
#   front of the Cloudflare credentials.
name: deploy

on:
  push:
    branches: [dev, stage, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy (rollback or redeploy)
        type: choice
        options: [dev, stage, production]
        required: true
      ref:
        description: Tag or commit to deploy (e.g. the previous production tag, for rollback)
        required: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      env_name: ${{ steps.resolve.outputs.name }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          # Full history and tags: the ref-reachability check below walks commit ancestry, and a production
          # dispatch is additionally required to name a release tag.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve environment name and pin the exact commit
        id: resolve
        env:
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_ENV}" ]; then
            name="${DISPATCH_ENV}"
          elif [ "${BRANCH}" = "main" ]; then
            name="production"
          else
            name="${BRANCH}"
          fi
          case "${name}" in
            dev|stage|production) ;;
            *) echo "::error::unknown environment '${name}' (from branch '${BRANCH}')"; exit 1 ;;
          esac
          echo "name=${name}" >> "$GITHUB_OUTPUT"

          # Resolved once, here, to a 40-char SHA. If `ref` was a branch or tag name, re-resolving it in the
          # `deploy` job's own checkout would be a second, independent lookup — anyone who can both dispatch
          # and push (e.g. force-push a branch used as `ref`) could move that name to an unreviewed commit in
          # the gap between the two jobs, which on `production` is the whole wait for the required-reviewer
          # approval (SECURITY review round 2). `deploy` checks out this exact SHA and re-asserts it, so the
          # commit it builds and deploys is the same one every check below ran against, guaranteed by git's
          # own object identity rather than by a name that can be reassigned.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Deployment branch policies (owner checklist) already restrict which branch may *start* a run for a
      # given environment, but they only look at `github.ref` — never at the `ref` input a dispatch can
      # override the checkout with. Without this, `workflow_dispatch` from `main` with `environment: dev` and
      # an arbitrary `ref` would still pass the policy and reach the dev Cloudflare credentials.
      - name: Verify workflow_dispatch targets its own branch and a reviewed commit
        if: github.event_name == 'workflow_dispatch'
        env:
          ENV_NAME: ${{ steps.resolve.outputs.name }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          case "${ENV_NAME}" in
            dev) branch=dev ;;
            stage) branch=stage ;;
            production) branch=main ;;
          esac
          if [ "${DISPATCH_REF_TYPE}" != "branch" ] || [ "${DISPATCH_REF_NAME}" != "${branch}" ]; then
            echo "::error::a '${ENV_NAME}' dispatch must be started from the '${branch}' branch (this run was started from ${DISPATCH_REF_TYPE} '${DISPATCH_REF_NAME}'), so the workflow file that actually runs is the reviewed one on that branch"
            exit 1
          fi

          git fetch --no-tags --quiet origin "${branch}"
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::the checked-out ref is not reachable from origin/${branch} — refusing to deploy a commit no pull request into ${branch} ever merged"
            exit 1
          fi

          # ADR 0001 decision 14: production releases are tagged; rollback = the previous tag. The regular
          # push-to-main path (a merged release PR) is not required to be tagged at push time.
          if [ "${ENV_NAME}" = "production" ]; then
            tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
            case "${tag}" in
              v*) : ;;
              *) echo "::error::a production dispatch must target a 'v*' release tag (got '${tag:-<none>}' on $(git rev-parse --short HEAD))"; exit 1 ;;
            esac
          fi

      # tools/deploy-guard/check-d1-placeholder.js parses the JSONC (comments and trailing commas stripped,
      # string-aware) and only ever compares `env.<env>.d1_databases[].database_id` — a plain `grep` for the
      # placeholder UUID matches it anywhere in the file, including inside a comment that only describes it
      # (PR #69 regression: a comment on the real dev id tripped this and blocked every dev deploy). No npm
      # dependency and no `npm ci` needed: the runner's preinstalled Node is enough, keeping this job cheap.
      - name: Guard against placeholder D1 database ids (api and hooks)
        env:
          ENV_NAME: ${{ steps.resolve.outputs.name }}
        run: |
          set -euo pipefail
          case "${ENV_NAME}" in
            dev) placeholder='00000000-0000-0000-0000-00000000dev1' ;;
            stage) placeholder='00000000-0000-0000-0000-0000000stage' ;;
            production) placeholder='00000000-0000-0000-0000-000000000prd' ;;
          esac
          node tools/deploy-guard/check-d1-placeholder.js "${ENV_NAME}" "${placeholder}" \
            apps/api/wrangler.jsonc apps/hooks/wrangler.jsonc

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # One deploy per environment at a time; a newer push waits instead of cancelling a running deploy.
      group: deploy-${{ needs.guard.outputs.env_name }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.guard.outputs.env_name }}
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
      WRANGLER_SEND_METRICS: 'false'
      ENV_NAME: ${{ needs.guard.outputs.env_name }}
    steps:
      # The exact SHA `guard` validated, not the original (possibly mutable) `ref` input — see the comment on
      # `guard`'s "Resolve environment name and pin the exact commit" step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false

      - name: Assert this checkout is exactly the commit guard validated
        env:
          EXPECTED_SHA: ${{ needs.guard.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "::error::checked out ${actual}, expected ${EXPECTED_SHA} from guard — refusing to deploy"
            exit 1
          fi
          echo "::notice::deploying ${actual} to '${ENV_NAME}'"

      - uses: ./.github/actions/setup-node-npm

      - run: npm ci

      # Patches apps/console's own `define` config (project.json) in place, in this checkout only — never
      # committed — so the single `nx build` below (console runs as api's dependency, same process, same task
      # graph) picks it up with no extra CLI flags. A CLI override here instead would give console:build a
      # different task hash than the one api's dependsOn computes from project.json, so Nx would silently
      # rebuild console a second time without it, discarding the injected value (see apps/console/src/app/
      # build-info.ts). Local/dev/Docker builds never run this step, so they keep the "local" default.
      #
      # The stamped commit is `HEAD` — the deployed, guard-pinned commit asserted above — never `GITHUB_SHA`:
      # on a `workflow_dispatch` rollback/redeploy `GITHUB_SHA` is still the branch tip, not the older `ref`
      # this run actually checked out and is deploying (SECURITY review, PR #69).
      - name: Stamp the console build with the real build time and the deployed commit
        run: |
          set -euo pipefail
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ) ($(git rev-parse --short=7 HEAD))"
          tmp=$(mktemp)
          jq --arg definedValue "\"${built_at}\"" \
            '.targets.build.configurations.production.define.__TC_BUILT_AT__ = $definedValue' \
            apps/console/project.json > "${tmp}"
          cat "${tmp}" > apps/console/project.json
          rm -f "${tmp}"

      # Build once for this push; api's Nx target depends on console, so this also builds the SPA the api
      # Worker serves as static assets (ADR 0001 decisions 4, 14).
      - name: Build api and hooks
        run: npx nx run-many -t build --projects=api,hooks

      - name: D1 migrations (remote, before traffic moves)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.124.0
          workingDirectory: apps/api
          command: d1 migrations apply team-console-${{ env.ENV_NAME }} --env ${{ env.ENV_NAME }} --remote

      # VAPID_PUBLIC_KEY (#11) is the same kind of value: the environment variable the owner pasted from
      # tools/owner-setup/set-secrets.sh; without it the push routes answer 503 push-misconfigured.
      # ACCESS_TEAM_DOMAIN/ACCESS_AUD/GITHUB_APP_ID/GITHUB_APP_CLIENT_ID/OWNER_GITHUB_LOGIN all live in exactly
      # one place: non-secret GitHub Environment *variables* (owner checklist; the GitHub App ones are set by
      # tools/owner-setup/create-apps.sh, #61, ADR 0003 decision 7) — never in apps/api/wrangler.jsonc, which
      # keeps them committed empty/absent on purpose (this repository is public). `--var` always wins over the
      # config, including when a variable is still unset (an empty override), so the Worker fails closed
      # either way until the owner sets all five (ADR 0001 decision 7, ADR 0003 decision 7).
      #
      # The two `--var NAME:${{ vars.CONSOLE_NAME }}` pairs below deliberately read from a differently-named
      # GitHub variable than the Worker binding they set: GitHub rejects a configuration variable whose name
      # starts with the reserved GITHUB_ prefix (actionlint catches `vars.GITHUB_APP_ID` as invalid — verified
      # against the documented naming convention for configuration variables), so create-apps.sh writes
      # CONSOLE_GITHUB_APP_ID / CONSOLE_GITHUB_APP_CLIENT_ID on the GitHub side. The left-hand side of `--var`
      # is only wrangler's own binding name, not subject to that rule, so apps/api/src/env.ts still declares
      # plain GITHUB_APP_ID / GITHUB_APP_CLIENT_ID exactly as ADR 0003 specifies.
      - name: Deploy api Worker (app + assets)
        id: deploy_api
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.124.0
          workingDirectory: apps/api
          command: >-
            deploy --env ${{ env.ENV_NAME }}
            --var ACCESS_TEAM_DOMAIN:${{ vars.ACCESS_TEAM_DOMAIN }}
            --var ACCESS_AUD:${{ vars.ACCESS_AUD }}
            --var GITHUB_APP_ID:${{ vars.CONSOLE_GITHUB_APP_ID }}
            --var GITHUB_APP_CLIENT_ID:${{ vars.CONSOLE_GITHUB_APP_CLIENT_ID }}
            --var OWNER_GITHUB_LOGIN:${{ vars.OWNER_GITHUB_LOGIN }}
            --var VAPID_PUBLIC_KEY:${{ vars.VAPID_PUBLIC_KEY }}

      - name: Deploy hooks Worker
        id: deploy_hooks
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.124.0
          workingDirectory: apps/hooks
          # The hooks Worker sends the webhook pushes (#12) with the same VAPID pair as the api Worker (#11).
          command: >-
            deploy --env ${{ env.ENV_NAME }}
            --var VAPID_PUBLIC_KEY:${{ vars.VAPID_PUBLIC_KEY }}

      # Carry-over from PR #49 reviews (issue #7 comment 2026-09-29) plus PR #54 review: until #8 lands and
      # Access is configured, /api/v1/* answers 401 (Worker fail-closed); once Access owns the hostname, an
      # unauthenticated request never reaches the Worker at all and gets Access's 302 login redirect instead.
      # Anything else (200, 5xx, a stray 404) is a broken deploy, not a pass — this is true for every
      # environment including the very first dev deploy (owner checklist sets up Access before that run).
      #
      # Placed right after the two Worker deploys (issue #182): these must always run, whatever happens to the
      # Storybook steps below, so a broken api/hooks deploy is never masked by an unrelated Storybook failure.
      - name: Smoke check — app Worker requires Access or fails closed
        env:
          API_URL: ${{ steps.deploy_api.outputs.deployment-url }}
        run: |
          set -euo pipefail

          assert_blocked() {
            local path="$1" status location
            for _ in 1 2 3 4 5 6; do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${API_URL}${path}" || true)
              case "${status}" in
                401|403)
                  echo "::notice::${API_URL}${path} -> ${status} (Worker fail-closed)"
                  return 0
                  ;;
                302)
                  location=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 10 "${API_URL}${path}" || echo "")
                  case "${location}" in
                    https://*.cloudflareaccess.com/*)
                      echo "::notice::${API_URL}${path} -> 302 to ${location} (Access redirect)"
                      return 0
                      ;;
                    *)
                      echo "::error::${API_URL}${path} -> 302 to unexpected location '${location}', not an Access redirect"
                      return 1
                      ;;
                  esac
                  ;;
                000)
                  # DNS/connection not ready yet right after deploy — retry, do not fail immediately.
                  sleep 10
                  continue
                  ;;
                *)
                  echo "::error::${API_URL}${path} answered ${status}, expected 401/403 (Worker fail-closed) or 302 to *.cloudflareaccess.com (Access redirect)"
                  return 1
                  ;;
              esac
            done
            echo "::error::${API_URL}${path} never answered after retries (last status: ${status})"
            return 1
          }

          test -n "${API_URL}" || { echo "::error::wrangler did not report the api Worker's deployment URL"; exit 1; }
          assert_blocked "/"
          assert_blocked "/api/v1/healthz"

      # The hooks Worker is deliberately public (ADR 0001 decision 4); its /healthz must be a plain 200. The
      # retry loop tolerates a connection error (fresh workers.dev DNS) without aborting under `set -e`.
      - name: Smoke check — hooks Worker is reachable
        env:
          HOOKS_URL: ${{ steps.deploy_hooks.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "${HOOKS_URL}" || { echo "::error::wrangler did not report the hooks Worker's deployment URL"; exit 1; }
          status=000
          for _ in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${HOOKS_URL}/healthz" || true)
            [ "${status}" = "200" ] && break
            sleep 10
          done
          if [ "${status}" != "200" ]; then
            echo "::error::${HOOKS_URL}/healthz did not answer 200 after deploy (last status: ${status})"
            exit 1
          fi

      # The design kit lib landed in #13/#75 as the Nx project `console-shared-ui` (not `ui` — PR #75 review
      # follow-up, #25): `.product-team/project.yml`'s `commands.storybook` already names it correctly. This
      # check stays, loudly SKIPping instead of failing the whole deploy, as a guard against the project ever
      # being renamed or removed again.
      #
      # Runs after the smoke checks above (issue #182): a Storybook failure must not hide whether the api/hooks
      # Workers that were just deployed are healthy. Still a normal `if: success()` chain (default) — once the
      # smoke checks above have run and passed, a Storybook failure fails the job on its own, same as before;
      # never `continue-on-error`, so a broken Storybook build/deploy still shows red.
      - name: Check Storybook project exists
        id: storybook
        if: env.ENV_NAME == 'dev'
        run: |
          set -euo pipefail
          if npx nx show projects 2>/dev/null | grep -qx console-shared-ui; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SKIPPED Storybook deploy — the console-shared-ui Nx project is missing; this is NOT a pass"
          fi

      - name: Build Storybook
        if: env.ENV_NAME == 'dev' && steps.storybook.outputs.ready == 'true'
        run: npx nx build-storybook console-shared-ui

      # Direct upload (no Pages build consumed, ADR 0001 decision 14 / Pages free-tier limit table). Owner
      # checklist creates the `team-console-storybook` Pages project up front: `wrangler pages deploy` only
      # offers to create a missing project on an interactive terminal, and CI has none.
      - name: Deploy Storybook
        id: deploy_storybook
        if: env.ENV_NAME == 'dev' && steps.storybook.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.124.0
          # libs/console/shared/ui's `build-storybook` target (project.json) writes here — matches the Nx
          # project name above, not the bare `ui` this step used before #25.
          command: pages deploy dist/storybook/console-shared-ui --project-name=team-console-storybook --branch=dev
