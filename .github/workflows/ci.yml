# Contract CI (plugin reference/stack-contract.md, ADR 0001 decision 18): install, lint, test, build on every PR.
# The job name `lint-test-build` is stable: `scripts/pr gate` and QA read the check runs by name.
# Job `e2e` runs apps/console-e2e (#14), sharded one Playwright project per job (#404: the single job was
# landing at 16-20 min against a 20 min timeout and several PR runs were cancelled at the limit); the `e2e`
# job itself is a thin aggregator over the `e2e-shard` matrix so the check name CI consumers look for
# (`scripts/pr gate`, branch rules) never changes.
# Also runs on push to dev (owner-approved 2026-10-01): two PRs can each be green alone and still break dev
# once merged together (#136 + #139) — that combination is only ever tested here, after the merge.
name: ci

on:
  pull_request:
    branches: [dev, stage, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  # PR runs key off the PR number so a newer PR run cancels an older one; a push-to-dev run keys off the
  # ref instead, in its own group, so it can never cancel (or be cancelled by) a PR run — only a newer push
  # to dev cancels an older one.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || format('dev-{0}', github.ref) }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  NX_TUI: 'false'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nx affected needs the PR base commit in local history.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node-npm

      - run: npm ci

      # ADR 0001 decision 18: NX_BASE / NX_HEAD come from nx-set-shas. On pull_request it takes the merge-base
      # of origin/<base branch> and HEAD, locally, without API calls.
      - name: Derive Nx base and head
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: dev

      # Affected by default; every project when the change can reach all of them without Nx seeing it
      # (CI, toolchain, root config) and on release PRs into stage/main. A push to dev is treated the same
      # as a PR into dev (BASE_REF=dev): dev never takes the expensive "release PR" path.
      - name: Select projects
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          # An empty NX_BASE would silently fall back to nx.json's defaultBase.
          [[ "${NX_BASE:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::nx-set-shas gave no base sha"; exit 1; }
          root_config='^(\.github/workflows/|package\.json$|package-lock\.json$|\.nvmrc$|nx\.json$|tsconfig\.base\.json$|eslint\.config\.mjs$|vitest\.config\.mts$)'
          # Captured first: `git diff | grep -q` under pipefail can fail on SIGPIPE and silently pick "affected".
          changed=$(git diff --name-only "${NX_BASE}" "${NX_HEAD}")
          if [ "${BASE_REF}" != "dev" ]; then
            mode="run-many"; why="release PR into ${BASE_REF}"
          elif grep -Eq "${root_config}" <<< "${changed}"; then
            mode="run-many"; why="root config or CI changed"
          else
            mode="affected"; why="changed since ${NX_BASE}"
          fi
          echo "NX_MODE=${mode}" >> "$GITHUB_ENV"
          echo "::notice title=Nx scope::nx ${mode} (${why}; base ${NX_BASE}, head ${NX_HEAD})"

      - name: Lint
        run: npx nx "${NX_MODE}" -t lint

      - name: Test
        run: npx nx "${NX_MODE}" -t test

      # #491: every project with a tsconfig.spec.json gets this target from tools/nx-plugins/typecheck-spec.plugin.ts,
      # so a new project is covered without touching this workflow. `test` (vitest, esbuild-transformed) never
      # typechecks spec files on its own — this is the only thing that does.
      - name: Typecheck specs
        run: npx nx "${NX_MODE}" -t typecheck-spec

      - name: Build
        run: npx nx "${NX_MODE}" -t build

      # ADR 0001 decision 5 / #6: the schema must apply to a fresh database with wrangler's own migrator (the
      # local backend is the same SQLite D1 runs on). Runs twice: the second pass must find nothing to apply.
      - name: D1 migrations on a fresh local database
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          rm -rf apps/api/.wrangler
          npx nx run api:migrate
          npx nx run api:migrate

  # #570 (architect note on #468, decision 13): plant-then-verify on the runner's `container` backend against this
  # machine's real Docker daemon — the runner image plus the fake CLI, two jobs through the real job loop, and a mount
  # probe. Its own job, so the image build never pushes lint-test-build past its timeout.
  runner-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-npm

      - run: npm ci

      - name: Build the runner image and the fake-CLI layer
        run: |
          set -euo pipefail
          docker build --file apps/runner/Dockerfile --tag tc-runner:ci .
          printf 'FROM tc-runner:ci\nCOPY --chown=root:root --chmod=0555 apps/runner/fixtures/claude-fake.mjs /opt/fixtures/claude-fake.mjs\n' \
            | docker build --file - --tag tc-runner:ci-fake .

      - name: Plant-then-verify on the container backend
        env:
          TC_RUNNER_TEST_IMAGE: tc-runner:ci-fake
        run: npx vitest run --config apps/runner/vitest.config.mts src/integration/container.integration.spec.ts

  # #14: the Playwright suite (apps/console-e2e) on every PR, whatever it touches — it is the regression guard for
  # the demo path. Each Playwright worker starts its own fake GitHub and the api bundle on a fresh local D1 (the
  # same `wrangler dev dist/apps/api/main.js` the Docker image runs); nothing reaches GitHub or Cloudflare.
  # One job per Playwright project instead of one job for all three (#404): `iphone` and `desktop` run the full
  # suite (the bulk of the ~350 tests) and are now the long pole at roughly half the old wall time each; the much
  # smaller `iphone-webkit` project (the demo path only) stays quick. Each shard rebuilds the app itself — no
  # cross-job cache — so this costs more total minutes than the single job did, in exchange for reliably finishing
  # instead of hitting the timeout (#404: a cancelled run at 20 min wasted the full 20 min for nothing).
  # #404 follow-up: even with the browser binary cached, `iphone-webkit` kept failing "browser install failed
  # after 2 attempts" — the cache only skips the binary download; `playwright install-deps` still apt-get installs
  # ~140 MB of OS libraries (gstreamer, codecs, fonts) from the Ubuntu mirror every run, which is what was timing
  # out, and the bounded `timeout 5m` left the child apt-get running so the retry immediately hit a held dpkg
  # lock. `iphone-webkit` now runs inside Microsoft's own Playwright image, which ships that browser and every
  # OS dependency already installed (pulled straight from MCR, not through apt) — no install-deps, no apt mirror,
  # no retry loop needed for this shard. `iphone`/`desktop` (chromium) are untouched: that shard was never the
  # one timing out, and keeping it on the bare runner avoids the extra minutes a container pull would add there.
  # The suite kept growing past this: `iphone`/`desktop` were at ~12-15 min against the 15 min timeout (one PR's
  # `iphone` shard was cancelled at the limit with every executed test passing). Each of those two chromium
  # projects is now Playwright-sharded 1/2 + 2/2 (matrix `name` iphone-1/iphone-2, desktop-1/desktop-2) so the
  # ~223 tests each run split two ways instead of growing the single job past budget again; `iphone-webkit`
  # (10 tests, already quick) stays a single unsharded shard in its own container. `project`/`browser`/`shard`
  # stay separate matrix fields from the display `name` so the cache key (keyed on `browser`) and the `--project`/
  # `--shard` flags below don't have to parse the display name back apart.
  e2e-shard:
    name: e2e-shard (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iphone-1
            project: iphone
            browser: chromium
            shard: '1/2'
          - name: iphone-2
            project: iphone
            browser: chromium
            shard: '2/2'
          - name: desktop-1
            project: desktop
            browser: chromium
            shard: '1/2'
          - name: desktop-2
            project: desktop
            browser: chromium
            shard: '2/2'
          - name: iphone-webkit
            project: iphone-webkit
            browser: webkit
            # Digest of mcr.microsoft.com/playwright:v1.63.0-noble, matching package.json's @playwright/test pin
            # exactly (the image's Playwright version must match the npm package's or the browser revision
            # mismatches). Pinned by digest, not tag, same as the action pins below.
            container: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    runs-on: ubuntu-latest
    # Empty string for the chromium shards is the documented way to make this a no-op for the rest of the matrix.
    container: ${{ matrix.container }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-npm

      - run: npm ci

      # Builds console then api (project.json dependsOn chain) — the same bundle the e2e stack and the Docker
      # image run. Done explicitly here (rather than through `nx e2e`) so this step is shared by every shard
      # while the playwright invocation below is scoped to just the one project.
      - name: Build the app under test
        run: npx nx build api

      # #404: this step alone hung twice until the job's 15 min timeout (apt mirror stalls fetching system
      # deps). The browser binary is cached by Playwright version (package-lock.json) so a cache hit only
      # needs `install-deps` (apt), not the binary download; a bounded per-attempt timeout plus one retry
      # absorbs a single slow/flaky mirror without burning the whole job timeout on a hang.
      # `iphone-webkit` skips this: it runs in the Microsoft Playwright image (see the `container:` on this
      # job above), which already has the webkit binary and every OS dep baked in — nothing to cache or
      # apt-get here, and that is the shard this step kept failing for (chromium's deps are mostly already on
      # the `ubuntu-latest` image, so its own install-deps stays fast).
      - name: Cache Playwright browser binaries
        if: matrix.project != 'iphone-webkit'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install the browser
        if: matrix.project != 'iphone-webkit'
        timeout-minutes: 11
        run: |
          set -euo pipefail
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            cmd=(npx playwright install-deps ${{ matrix.browser }})
          else
            cmd=(npx playwright install --with-deps ${{ matrix.browser }})
          fi
          for attempt in 1 2; do
            echo "::group::browser install attempt ${attempt}"
            if timeout 5m "${cmd[@]}"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::browser install attempt ${attempt} timed out or failed"
          done
          echo "::error::browser install failed after 2 attempts"
          exit 1

      - name: Typecheck the suite
        run: npx tsc -p apps/console-e2e/tsconfig.json --noEmit

      - name: e2e (${{ matrix.name }})
        env:
          WRANGLER_SEND_METRICS: 'false'
        # `matrix.shard` is unset (empty string) for iphone-webkit, which runs unsharded.
        # `shell: bash` because iphone-webkit's container (mcr.microsoft.com/playwright) defaults steps to
        # `sh`, which has neither `pipefail` nor array syntax; the bare runner defaults to bash already.
        shell: bash
        run: |
          set -euo pipefail
          args=(test --config apps/console-e2e/playwright.config.ts --project=${{ matrix.project }})
          shard='${{ matrix.shard }}'
          [ -n "$shard" ] && args+=(--shard="$shard")
          npx playwright "${args[@]}"

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-e2e-report-${{ matrix.name }}
          path: |
            dist/.playwright/apps/console-e2e
            tmp/console-e2e/*/*.log
          retention-days: 7

  # Thin aggregator: `scripts/pr gate` and branch rules read the check named `e2e`, so the matrix above keeps
  # its own name (`e2e-shard`) and this job turns its result into the one check consumers already look for.
  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every e2e shard to pass
        if: needs.e2e-shard.result != 'success'
        run: |
          echo "::error::e2e-shard result was '${{ needs.e2e-shard.result }}' — see the e2e-shard matrix jobs"
          exit 1
