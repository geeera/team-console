# Contract CI (plugin reference/stack-contract.md, ADR 0001 decision 18): install, lint, test, build on every PR.
# The job name `lint-test-build` is stable: `scripts/pr gate` and QA read the check runs by name.
# e2e joins this workflow with #14 (apps/console-e2e); until then no e2e job exists rather than a fake green one.
name: ci

on:
  pull_request:
    branches: [dev, stage, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  NX_TUI: 'false'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nx affected needs the PR base commit in local history.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The lockfile is written by npm 10; another major rewrites it (npm 11 adds libc fields and pulls
      # both glibc and musl native builds). Use exactly the npm pinned in package.json#packageManager.
      - name: Pin npm to packageManager
        run: |
          set -euo pipefail
          wanted=$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")
          npm install --global --no-audit --no-fund "npm@${wanted}"
          test "$(npm --version)" = "${wanted}"

      - run: npm ci

      # Affected by default; every project when the change can reach all of them without Nx seeing it
      # (CI, toolchain, root config) and on release PRs into stage/main.
      - name: Select projects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected base sha"; exit 1; }
          root_config='^(\.github/workflows/|package\.json$|package-lock\.json$|\.nvmrc$|nx\.json$|tsconfig\.base\.json$|eslint\.config\.mjs$|vitest\.config\.mts$)'
          # Captured first: `git diff | grep -q` under pipefail can fail on SIGPIPE and silently pick "affected".
          changed=$(git diff --name-only "${BASE_SHA}" HEAD)
          if [ "${BASE_REF}" != "dev" ]; then
            mode="run-many"; why="release PR into ${BASE_REF}"
          elif grep -Eq "${root_config}" <<< "${changed}"; then
            mode="run-many"; why="root config or CI changed"
          else
            mode="affected"; why="changed since ${BASE_SHA}"
          fi
          # `nx affected` reads NX_BASE / NX_HEAD from the environment.
          { echo "NX_MODE=${mode}"; echo "NX_BASE=${BASE_SHA}"; echo "NX_HEAD=HEAD"; } >> "$GITHUB_ENV"
          echo "::notice title=Nx scope::nx ${mode} (${why})"

      - name: Lint
        run: npx nx "${NX_MODE}" -t lint

      - name: Test
        run: npx nx "${NX_MODE}" -t test

      - name: Build
        run: npx nx "${NX_MODE}" -t build
