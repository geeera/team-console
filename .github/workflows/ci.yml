# Contract CI (plugin reference/stack-contract.md, ADR 0001 decision 18): install, lint, test, build on every PR.
# The job name `lint-test-build` is stable: `scripts/pr gate` and QA read the check runs by name. Since #992 it
# is a thin aggregator over `lint-test-build-scope` and the `lint-test-build-shard` matrix, as `e2e` is.
# Job `e2e` runs apps/console-e2e (#14), sharded one Playwright project per job (#404: the single job was
# landing at 16-20 min against a 20 min timeout and several PR runs were cancelled at the limit); the `e2e`
# job itself is a thin aggregator over the `e2e-shard` matrix so the check name CI consumers look for
# (`scripts/pr gate`, branch rules) never changes.
# Also runs on push to dev (owner-approved 2026-10-01): two PRs can each be green alone and still break dev
# once merged together (#136 + #139) — that combination is only ever tested here, after the merge.
name: ci

on:
  pull_request:
    branches: [dev, stage, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  # PR runs key off the PR number so a newer PR run cancels an older one; a push-to-dev run keys off the
  # ref instead, in its own group, so it can never cancel (or be cancelled by) a PR run — only a newer push
  # to dev cancels an older one.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || format('dev-{0}', github.ref) }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  NX_TUI: 'false'

jobs:
  # #992: `lint-test-build` was one job running lint, test, typecheck-spec and build one after another. With every
  # project selected ("run-many") it took 13-19.5 min against its 20 min timeout (run 45598018931 on PR #988:
  # 19m24s — test 722 s, typecheck-spec 208 s, lint 101 s, setup + npm ci ~120 s, build 28 s, migrations 18 s),
  # and #983 made run-many more frequent. It is three parallel jobs now (`lint-test-build-shard` below) behind
  # one decision made here, once: the scope (every project or the affected ones) and the base/head shas all
  # three use. Decided once and handed on, never per shard: on a push `nx-set-shas` asks the API for the last
  # successful run, so two shards asking separately could get two bases, split two different project lists and
  # leave a project in neither. No `npm ci` here: the action and the script need Node and git only.
  lint-test-build-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      base: ${{ steps.select.outputs.base }}
      head: ${{ steps.select.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nx affected needs the PR base commit in local history.
          fetch-depth: 0
          persist-credentials: false

      # Same pinned action and inputs as `runner-darwin-scope`: the Node .nvmrc pins, no npm cache to restore.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # ADR 0001 decision 18: NX_BASE / NX_HEAD come from nx-set-shas. On pull_request it takes the merge-base
      # of origin/<base branch> and HEAD, locally, without API calls.
      - name: Derive Nx base and head
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: dev

      # Affected by default; every project when the change can reach all of them without Nx seeing it
      # (CI, toolchain, root config) and on release PRs into stage/main. A push to dev is treated the same
      # as a PR into dev (BASE_REF=dev): dev never takes the expensive "release PR" path.
      - name: Select projects
        id: select
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          # An empty NX_BASE would silently fall back to nx.json's defaultBase.
          [[ "${NX_BASE:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::nx-set-shas gave no base sha"; exit 1; }
          [[ "${NX_HEAD:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::nx-set-shas gave no head sha"; exit 1; }
          # #983: also the composite action and tools/ci/ — the script below makes this very decision, and no Nx
          # project owns either, so a change to them alone used to select "affected" and run next to nothing.
          # The match ignores case (changed-paths.mjs).
          root_config='^(\.github/workflows/|\.github/actions/|tools/ci/|package\.json$|package-lock\.json$|\.nvmrc$|nx\.json$|tsconfig\.base\.json$|eslint\.config\.mjs$|vitest\.config\.mts$)'
          # #973: the paths are listed NUL-separated with renames split (tools/ci/changed-paths.mjs); a plain
          # `git diff --name-only | grep` misses a renamed-away root file and any path git has to quote.
          # A plain assignment on its own line, never inside the `if`: a failing script must stop the step
          # (set -e), not read as "no match" and silently pick "affected".
          root_changed=$(node tools/ci/changed-paths.mjs "${NX_BASE}" "${NX_HEAD}" "${root_config}")
          if [ "${BASE_REF}" != "dev" ]; then
            mode="run-many"; why="release PR into ${BASE_REF}"
          elif [ "${root_changed}" = "true" ]; then
            mode="run-many"; why="root config or CI changed"
          elif [ "${root_changed}" = "false" ]; then
            mode="affected"; why="changed since ${NX_BASE}"
          else
            echo "::error::changed-paths gave no answer"; exit 1
          fi
          {
            echo "mode=${mode}"
            echo "base=${NX_BASE}"
            echo "head=${NX_HEAD}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Nx scope::nx ${mode} (${why}; base ${NX_BASE}, head ${NX_HEAD})"

  # #992: the work of `lint-test-build`, as three jobs side by side. `static` runs lint, typecheck-spec, build
  # and the migrations (~6 min of the 19m24s run above); `test-1` and `test-2` each run half of the `test`
  # target (~6 min each), split by tools/ci/shard-projects.mjs. Each job pays its own checkout + `npm ci`
  # (~1-2 min), so the slowest run-many now lands around 8 min, and the timeout comes DOWN from 20 to 15: a hung
  # job is cut sooner, and 15 still leaves the worst case measured so far roughly half unused.
  # Sharded, not cached (owner direction on #992 was "shard or cache"): an Nx cache restored from dev would
  # answer exactly the runs this was slow for with cache hits. Run-many exists for changes Nx cannot see in a
  # project's inputs (this workflow, the composite action, tools/ci/, #983) — to Nx nothing changed, so every
  # task would be replayed from the cache and never executed, and the run would prove nothing. A cache also
  # brings a poisoning surface (a PR-written entry replayed on dev) that sharding does not have at all.
  lint-test-build-shard:
    name: lint-test-build-shard (${{ matrix.name }})
    needs: lint-test-build-scope
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
            kind: static
          - name: test-1
            kind: test
            shard: '1/2'
          - name: test-2
            kind: test
            shard: '2/2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # From `lint-test-build-scope`, checked again below before anything reads them.
      NX_MODE: ${{ needs.lint-test-build-scope.outputs.mode }}
      NX_BASE: ${{ needs.lint-test-build-scope.outputs.base }}
      NX_HEAD: ${{ needs.lint-test-build-scope.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nx affected needs the PR base commit in local history.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node-npm

      - run: npm ci

      # An empty NX_BASE would silently fall back to nx.json's defaultBase, and an unknown mode would be passed
      # to `nx` as a command. The head must be the commit checked out here: the scope job decided for that
      # commit, and a shard on another one would split a different project list.
      - name: Check the scope this shard was handed
        run: |
          set -euo pipefail
          [[ "${NX_MODE}" =~ ^(affected|run-many)$ ]] || { echo "::error::the scope job gave no mode"; exit 1; }
          [[ "${NX_BASE}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the scope job gave no base sha"; exit 1; }
          [[ "${NX_HEAD}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the scope job gave no head sha"; exit 1; }
          git cat-file -e "${NX_BASE}^{commit}" || { echo "::error::the base sha is not in this checkout"; exit 1; }
          checked_out=$(git rev-parse --verify 'HEAD^{commit}')
          [ "${checked_out}" = "${NX_HEAD}" ] || { echo "::error::the scope job decided for another commit"; exit 1; }

      - name: Lint
        if: matrix.kind == 'static'
        run: npx nx "${NX_MODE}" -t lint

      # #814: the whole repo, not the affected slice — formatting is a property of the tree, and the check is
      # only a few seconds. `.prettierignore` is the one list of exceptions (generated files).
      - name: Format check
        if: matrix.kind == 'static'
        run: npx nx format:check --all

      # The shard's slice of the projects that have a `test` target: every one of them in run-many, the affected
      # ones otherwise — `nx show projects` lists what `nx run-many`/`nx affected -t test` would run, and
      # tools/ci/shard-projects.mjs gives each shard its part of one split, so each project runs in exactly
      # one shard (tools/ci/shard-projects.test.mjs; tools/workspace-checks/src/ci-scope.spec.ts holds this
      # matrix to a complete 1/N..N/N set). Both answers are plain assignments on their own lines: a failing
      # `nx` or script stops the step (set -e) instead of reading as "nothing to test".
      # #71: workspace-checks specs read other projects' files (wrangler.jsonc, env.ts, worker-db) and root files
      # (Dockerfile, .product-team/) at runtime. Its implicitDependencies ["*"] make any project change affect it,
      # but a file no project owns affects nothing, so `--always` puts it in the list whatever the scope.
      # The weights level the two shards. The unit is one ordinary project (~7 s of the step in run
      # 45598018931, where runner took ~100 s, api ~90 s, workspace-checks ~35 s, console ~30 s, hooks ~25 s);
      # every project without a weight counts 1. A stale or missing weight changes the balance, never the cover;
      # ci-scope.spec.ts fails on a weight whose project is gone or has no `test` target (#999).
      # #999, when a shard may be empty: only in an affected run, where a change can leave a shard (or, without
      # `--always`, the whole run) nothing to test. A full run always has tests, so there an empty list from
      # `nx show projects` or an empty shard means the listing went wrong: `--scope run-many` makes
      # shard-projects.mjs fail on both, and the check below repeats it rather than skip with a notice.
      - name: Test (${{ matrix.name }})
        if: matrix.kind == 'test'
        env:
          SHARD: ${{ matrix.shard }}
          TEST_WEIGHTS: runner=14,api=13,workspace-checks=5,console=4,hooks=4
        run: |
          set -euo pipefail
          if [ "${NX_MODE}" = "affected" ]; then
            listed=$(npx nx show projects --affected --base="${NX_BASE}" --head="${NX_HEAD}" --with-target test --json)
          else
            listed=$(npx nx show projects --with-target test --json)
          fi
          projects=$(node tools/ci/shard-projects.mjs "${SHARD}" --scope "${NX_MODE}" --always workspace-checks --weights "${TEST_WEIGHTS}" <<<"${listed}")
          if [ -z "${projects}" ]; then
            if [ "${NX_MODE}" != "affected" ]; then
              echo "::error title=Test shard ${SHARD}::a full run gave this shard no project to test"
              exit 1
            fi
            echo "::notice title=Test shard ${SHARD}::no project with a test target in this shard"
            exit 0
          fi
          echo "::notice title=Test shard ${SHARD}::${projects}"
          npx nx run-many -t test --projects="${projects}"

      # #491: every project with a tsconfig.spec.json gets this target from tools/nx-plugins/typecheck-spec.plugin.ts,
      # so a new project is covered without touching this workflow. `test` (vitest, esbuild-transformed) never
      # typechecks spec files on its own — this is the only thing that does.
      - name: Typecheck specs
        if: matrix.kind == 'static'
        run: npx nx "${NX_MODE}" -t typecheck-spec

      - name: Build
        if: matrix.kind == 'static'
        run: npx nx "${NX_MODE}" -t build

      # ADR 0001 decision 5 / #6: the schema must apply to a fresh database with wrangler's own migrator (the
      # local backend is the same SQLite D1 runs on). Runs twice: the second pass must find nothing to apply.
      - name: D1 migrations on a fresh local database
        if: matrix.kind == 'static'
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          rm -rf apps/api/.wrangler
          npx nx run api:migrate
          npx nx run api:migrate

  # Thin aggregator, as `e2e` below: `scripts/pr gate`, QA and dev's branch ruleset read the check named
  # `lint-test-build`, so that name stays on one job and stands for the scope job and every shard. `always()`
  # so a failed, cancelled or skipped shard turns this check red instead of leaving it skipped (a skipped
  # required check counts as passed).
  lint-test-build:
    name: lint-test-build
    needs: [lint-test-build-scope, lint-test-build-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the scope job and every shard to pass
        env:
          SCOPE_RESULT: ${{ needs.lint-test-build-scope.result }}
          SHARD_RESULT: ${{ needs.lint-test-build-shard.result }}
        run: |
          set -euo pipefail
          if [ "${SCOPE_RESULT}" != "success" ] || [ "${SHARD_RESULT}" != "success" ]; then
            echo "::error::lint-test-build-scope was '${SCOPE_RESULT}', lint-test-build-shard was '${SHARD_RESULT}' — see those jobs"
            exit 1
          fi

  # #570 (architect note on #468, decision 13): plant-then-verify on the runner's `container` backend against
  # this machine's real Docker daemon — the runner image plus the fake CLI, two jobs through the real job loop,
  # and a mount probe. Its own job, so the image build never pushes lint-test-build past its timeout.
  runner-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-npm

      - run: npm ci

      - name: Build the runner image and the fake-CLI layer
        run: |
          set -euo pipefail
          docker build --file apps/runner/Dockerfile --tag tc-runner:ci .
          printf 'FROM tc-runner:ci\nCOPY --chown=root:root --chmod=0555 apps/runner/fixtures/claude-fake.mjs /opt/fixtures/claude-fake.mjs\n' \
            | docker build --file - --tag tc-runner:ci-fake .

      - name: Plant-then-verify on the container backend
        env:
          TC_RUNNER_TEST_IMAGE: tc-runner:ci-fake
        run: npx vitest run --config apps/runner/vitest.config.mts src/integration/container.integration.spec.ts

  # #998 (#818.3): the root Dockerfile — the local/e2e image, never deployed — was built by nobody in CI, so a
  # broken `.dockerignore` or build context (#818.1) reached dev and was found by hand weeks later. Its build
  # context is the whole repository minus `.dockerignore`, and `nx run-many -t build` inside it loads every
  # project's config, so the job below runs for a change to any root file, `apps/`, `libs/`, the image's own
  # tools, the Nx plugins the graph loads, the `project.json` of any tool (#1005: the graph loads those too, and
  # a broken one stops the build inside the image), the vendored plugin files `.dockerignore` re-includes, this
  # workflow or the script that makes this decision; and on every release PR into stage/main. Docs,
  # `.product-team/` and the other tools' sources cannot reach the image and skip it. Decided by the same call
  # as `runner-darwin-scope` (`changed-paths.mjs --event-scope`, #1005), with this job's own pattern.
  # Neither job is one of dev's required status checks; a skipped build never blocks a merge.
  runtime-image-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Does this change reach the root image?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          paths='^([^/]+$|apps/|libs/|tools/runtime-image/|tools/nx-plugins/|tools/[^/]+/project\.json$|\.claude/product-team/|\.github/workflows/ci\.yml$|tools/ci/changed-paths\.mjs$)'
          # One plain assignment: a failing script stops the step (set -e) instead of reading as "no change".
          run=$(node tools/ci/changed-paths.mjs --event-scope "${paths}")
          # The job output gates the build on the exact string 'true'; anything else must not reach it.
          [[ "${run}" =~ ^(true|false)$ ]] || { echo "::error::changed-paths gave no answer"; exit 1; }
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Root image scope::${run}"

  # Builds the image exactly as the Dockerfile's header says (`docker build .`), holds it to its file list and
  # starts it. Nothing is pushed and no registry is logged in to: the image and its two stages stay in this
  # runner's Docker daemon and go away with it. The build itself runs tools/runtime-image/check-runtime-tree.mjs
  # (the pruned tree against the lockfile); what is added here is what the build cannot see of itself.
  runtime-image:
    needs: runtime-image-scope
    if: needs.runtime-image-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: tc-console:ci
      CONTAINER: tc-console-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only for tools/runtime-image/image-files.mjs and guard-output.mjs on the runner (Node builtins, no
      # `npm ci`); the image brings its own Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Every step below prints text this job did not write: the build's output, paths and `bin` values from
      # the image, whatever the container answers and logs. All of it goes through
      # tools/runtime-image/guard-output.mjs, which prints it between `::stop-commands::` markers (#1005,
      # #1013), so a line of it shaped like a workflow command is log text and nothing else. The runner reads
      # two shapes: `::name::` at the start of a line and the older `##[name]` anywhere in one, which a prefix
      # such as BuildKit's `#12 0.3` does not defuse. This step holds the guard to the runner itself, with the
      # one command whose effect a later step can read, `set-output` (deprecated, which is why the two probe
      # lines are data in guard-probe.txt and not commands of this file). Printed bare, before and after, they
      # must arrive, so the probe can fail (each costs a deprecation warning on the run); printed through the
      # guard, in either of its modes, they must not.
      # Whatever the runner does with `set-output`, the guard's own part is checked here too (#1019): what it
      # printed is the probe text, unchanged, between the two markers of one token. Once GitHub disables
      # `set-output`, the runner fails this step on the bare lines (as it did for `set-env`) and no probe output
      # arrives; `continue-on-error` keeps the job going so that the next step can tell that from a leak. It
      # decides from `held`, which only this script, run to its end, writes, and through the environment file,
      # not through the command it probes.
      - name: Probe the output guard with both forms of a workflow command
        id: guard
        continue-on-error: true
        run: |
          set -euo pipefail
          probe() {
            sed "s/PROBE/$1/" tools/runtime-image/guard-probe.txt
          }
          held() {
            local open token
            open=$(head -n 1 "$1")
            [[ "${open}" =~ ^::stop-commands::([0-9a-f]{32})$ ]] || return 1
            token=${BASH_REMATCH[1]}
            [ "$(tail -n 1 "$1")" = "::${token}::" ] || return 1
            cmp --silent <(sed '1d;$d' "$1") <(probe "$2")
          }
          printed="${RUNNER_TEMP}/guard-probe"
          probe control
          probe guarded | node tools/runtime-image/guard-output.mjs | tee "${printed}.guarded"
          probe stream | node tools/runtime-image/guard-output.mjs --stream | tee "${printed}.stream"
          probe after
          if ! held "${printed}.guarded" guarded || ! held "${printed}.stream" stream; then
            echo "::error::the guard did not print the probe between the markers of one token"
            exit 1
          fi
          echo "held=true" >> "$GITHUB_OUTPUT"

      - name: The guard held both forms, and commands work again after it
        env:
          HELD: ${{ steps.guard.outputs.held }}
          OUTCOME: ${{ steps.guard.outcome }}
          CONTROL: ${{ steps.guard.outputs.control_colon }}/${{ steps.guard.outputs.control_bracket }}
          AFTER: ${{ steps.guard.outputs.after_colon }}/${{ steps.guard.outputs.after_bracket }}
          GUARDED: ${{ steps.guard.outputs.guarded_colon }}/${{ steps.guard.outputs.guarded_bracket }}
          STREAM: ${{ steps.guard.outputs.stream_colon }}/${{ steps.guard.outputs.stream_bracket }}
        run: |
          set -euo pipefail
          echo "markers: ${HELD:-not checked}; bare: ${CONTROL} before, ${AFTER} after; guarded: ${GUARDED}; stream: ${STREAM}"
          [ "${HELD}" = "true" ] \
            || { echo "::error::the probe did not run to its end, or the guard's markers were wrong"; exit 1; }
          [ "${GUARDED} ${STREAM}" = "/ /" ] \
            || { echo "::error::a workflow command got through the output guard"; exit 1; }
          case "${CONTROL} ${AFTER} ${OUTCOME}" in
            "on/on on/on success") ;;
            "/ / "*)
              echo "::warning::the runner no longer runs set-output: the guard's markers were checked, the runner's reading of them was not; replace the probe command"
              ;;
            *) echo "::error::the bare probe commands arrived only in part, so the probe proves nothing"; exit 1 ;;
          esac

      # The two `--target` builds add no work: they stop at stages the first build has just cached, and only
      # give those stages a name to list files from. `--stream`: the build is watched while it runs.
      - name: Build the image and the two stages it copies from
        run: |
          set -euo pipefail
          build() {
            docker build --tag "${IMAGE}" .
            docker build --target runtime-deps --tag "${IMAGE}-runtime-deps" .
            docker build --target build --tag "${IMAGE}-build" .
          }
          build 2>&1 | node tools/runtime-image/guard-output.mjs --stream

      # Every path in the image must be the pinned base image's own or a copy the `runtime` stage makes from one
      # of those two stages — same type, mode, size, sha256 and link target, owned by `node` — and nothing may
      # be missing (tools/runtime-image/image-files.mjs; its table of copies is held to the Dockerfile by
      # image-files.spec.ts). So a change to what the image ships shows up here as a one-line change to that
      # table, and anything else that moved fails the job. The listings run without a network, as root (to read
      # every file), with the script mounted read-only. They go to files; what the step prints (the pull of the
      # base image, the paths the check names) goes through the guard.
      - name: Hold the image to its file list
        run: |
          set -euo pipefail
          check() {
            local base lists
            base=$(node tools/runtime-image/image-files.mjs base-image Dockerfile)
            lists="${RUNNER_TEMP}/image-files"
            mkdir -p "${lists}"
            list() {
              docker run --rm --network none --user 0 --entrypoint node \
                --volume "${PWD}/tools/runtime-image/image-files.mjs:/image-files.mjs:ro" \
                "$2" /image-files.mjs list "$1" > "${lists}/$1.jsonl"
            }
            list base "${base}"
            list runtime-deps "${IMAGE}-runtime-deps"
            list build "${IMAGE}-build"
            list runtime "${IMAGE}"
            node tools/runtime-image/image-files.mjs check "${lists}"
          }
          check 2>&1 | node tools/runtime-image/guard-output.mjs

      # The container as `docker run` starts it: its CMD applies the migrations to a fresh local D1 and then
      # serves the Worker, so a healthz answer means both happened. The image's own HEALTHCHECK must agree, the
      # process must be `node`'s, and wrangler, asked again from inside, must find no migration left to apply.
      # Whatever the container answers, on stdout or stderr (#1013), is captured and printed by `show`: through
      # the guard, with a token made on the runner for that one print after the text is known. So is what the
      # tools print about it (#1019): `captured` runs a command whose stdout the step reads and prints its stderr
      # (curl's errors, jq's, docker's) through `show`, and the container id `docker run --detach` answers goes
      # there too. `show` writes to the step's own stdout (fd 3), also from inside `$(…)`. The `::error::` lines
      # below carry constant text only.
      # Last, the container must end on `docker stop` (#1013): its PID 1 is wrangler's launcher, which has to
      # pass SIGTERM on. Exit code 143 is that signal; 137 would be the SIGKILL Docker sends after the 20 s,
      # and `timeout` bounds the stop itself.
      - name: Start the container, wait for /api/v1/healthz and stop it
        run: |
          set -euo pipefail
          exec 3>&1
          show() {
            printf '%s\n' "$1" | node tools/runtime-image/guard-output.mjs >&3
          }
          captured() {
            local errors status=0
            errors=$(mktemp -p "${RUNNER_TEMP}")
            "$@" 2>"${errors}" || status=$?
            [ ! -s "${errors}" ] || show "$(cat "${errors}")"
            rm -f "${errors}"
            return "${status}"
          }
          started=$(captured docker run --detach --name "${CONTAINER}" --publish 127.0.0.1:8787:8787 "${IMAGE}")
          show "started: ${started}"
          state=starting
          for _ in $(seq 1 90); do
            state=$(captured docker inspect --format '{{.State.Status}}/{{.State.Health.Status}}' "${CONTAINER}")
            case "${state}" in
              running/healthy) break ;;
              running/starting) sleep 2 ;;
              *) break ;;
            esac
          done
          if [ "${state}" != "running/healthy" ]; then
            show "state: ${state}"
            echo "::error::the container is not running/healthy"
            exit 1
          fi
          body=$(captured curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8787/api/v1/healthz)
          show "healthz: ${body}"
          health=$(captured jq --raw-output '.status' <<<"${body}")
          [ "${health}" = "ok" ] || { echo "::error::healthz did not answer status ok"; exit 1; }
          captured curl --fail --silent --show-error --max-time 10 --output /dev/null http://127.0.0.1:8787/
          user=$(docker exec "${CONTAINER}" id -un 2>&1)
          show "user: ${user}"
          [ "${user}" = "node" ] || { echo "::error::the container does not run as node"; exit 1; }
          migrations=$(docker exec "${CONTAINER}" /app/node_modules/.bin/wrangler d1 migrations list team-console-dev --local --config apps/api/wrangler.jsonc --env dev 2>&1)
          show "${migrations}"
          grep --quiet --fixed-strings 'No migrations to apply' <<<"${migrations}" \
            || { echo "::error::the running container still has migrations to apply"; exit 1; }
          stopped=$(timeout 40 docker stop -t 20 "${CONTAINER}" 2>&1) \
            || { show "${stopped}"; echo "::error::docker stop failed or did not return in 40 s"; exit 1; }
          ended=$(captured docker inspect --format '{{.State.Status}}/{{.State.ExitCode}}/{{.State.OOMKilled}}' "${CONTAINER}")
          show "stopped: ${ended}"
          [ "${ended}" = "exited/143/false" ] \
            || { echo "::error::the container did not end on SIGTERM (exited/143/false expected)"; exit 1; }

      # The log is the container's own text from its first line. It is read to its end first, and the guard
      # makes the token only then (#1013): no line of the log was written while the token existed.
      - name: Container log
        if: always()
        run: |
          set -euo pipefail
          { docker logs "${CONTAINER}" 2>&1 || true; } | node tools/runtime-image/guard-output.mjs

  # #947: GitHub's hosted macOS pools are capacity-constrained; a macOS job can sit queued for 20+ minutes and
  # then be cancelled by GitHub itself ("The job was not acquired by Runner of type hosted even after multiple
  # attempts") — `timeout-minutes` never starts, and the run goes red for a change that could not have touched
  # the sweep. So the macOS job runs only when its inputs can have changed: anything under `apps/runner/` (the
  # templates, the spec, its vitest config), `libs/shared/contracts/` (the templates import `NODE_FILE` and
  # `RUNNER_INSTALL_PREFIX` from there), `libs/shared/plain-text/`, which contracts imports in turn, and
  # `libs/shared/redaction/`, which the runner's config imports (#973; tools/workspace-checks/src/ci-scope.spec.ts
  # walks the sweep spec's imports and fails when one lands outside this list),
  # this workflow, its composite action and the script that makes this decision, or the toolchain pins the
  # root-config rule of `lint-test-build-scope` names; and on every release PR into stage/main, as there.
  # The script runs on the Node .nvmrc pins (#983: the image's own Node moves with the runner image, and a
  # scope decision must not depend on it), without `npm ci`: it uses Node builtins and git only. The pattern
  # is matched ignoring case (#983): the macOS job checks out onto a case-insensitive volume, where a path
  # that differs only in case from one below is the same file.
  # `runner-darwin-sweep` is not itself one of dev's required status checks (branch ruleset 24176349 requires
  # `lint-test-build`, `secret-scan`, `sast`, `dependency-audit`, `e2e`, `runner-container`, `workflow-lint`), so
  # a skipped sweep never blocks a merge either way — scoping only saves minutes and avoids the queue below.
  # Decided here on Linux (git only, no API call, as `lint-test-build-scope`'s "Select projects" does), not on the
  # macOS runner the decision is meant to spare.
  runner-darwin-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same pinned action and inputs as security.yml's script-test jobs: Node only, no npm cache to restore.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Does this change reach the Darwin sweep?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          paths='^(apps/runner/|libs/shared/contracts/|libs/shared/plain-text/|libs/shared/redaction/|\.github/workflows/ci\.yml$|\.github/actions/|tools/ci/changed-paths\.mjs$|package\.json$|package-lock\.json$|\.nvmrc$|nx\.json$|tsconfig\.base\.json$|vitest\.config\.mts$)'
          # tools/ci/changed-paths.mjs lists the paths NUL-separated with renames split: a plain
          # `git diff --name-only` prints only a renamed file's new path (missing the old one a
          # rename-out-of-scope touched) and quotes any path holding a non-ASCII byte, a quote, a backslash or
          # a control character, so either would let a change slip past the regex (#955 and #963 reviews, #973).
          # `--event-scope` (#1005) is the decision this step and `runtime-image-scope` share: a release PR is
          # always in scope, a PR into dev compares the merge commit with its first parent, a push compares
          # with the commit before it, and a push without one is in scope. Its answer is a plain assignment on
          # its own line so that a failing script stops the step (set -e) instead of reading as "nothing changed".
          run=$(node tools/ci/changed-paths.mjs --event-scope "${paths}")
          # The job output gates the macOS job on the exact string 'true'; anything else must not reach it.
          [[ "${run}" =~ ^(true|false)$ ]] || { echo "::error::changed-paths gave no answer"; exit 1; }
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Darwin sweep scope::${run}"

  # #651: the Darwin branch of the job-exec sweep spec (`it.runIf(process.platform === 'darwin')` in
  # apps/runner/src/install/templates.spec.ts) only ever ran on the Linux runners above, so it never actually
  # executed in CI. A dedicated macOS job for just that one spec file keeps the minutes small instead of
  # moving the whole runner suite (or `lint-test-build`) onto a macOS runner.
  # #958: even scoped (above), this job kept queuing out on `macos-latest`'s arm64 pool. `macos-15-intel` is
  # GitHub's separate x64 pool — same real macOS run #651 asked for, just not sharing the arm64 pool's
  # capacity problem. Nothing the sweep checks is arch-sensitive: `getconf`'s Darwin keys and the
  # `/var/folders/<..>/[TC]` layout templates.spec.ts asserts on are identical on Intel and Apple silicon, and
  # `homebrewBinOf` (templates.ts) already covers both Homebrew prefixes (`/opt/homebrew` and `/usr/local`).
  runner-darwin-sweep:
    needs: runner-darwin-scope
    if: needs.runner-darwin-scope.outputs.run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-npm

      - run: npm ci

      - name: Darwin job-exec sweep (apps/runner)
        run: npx vitest run --config apps/runner/vitest.config.mts src/install/templates.spec.ts

  # #14: the Playwright suite (apps/console-e2e) on every PR, whatever it touches — it is the regression guard for
  # the demo path. Each Playwright worker starts its own fake GitHub and the api bundle on a fresh local D1 (the
  # bundle the Docker image runs, on Miniflare directly rather than `wrangler dev`, #957); nothing reaches GitHub or
  # Cloudflare.
  # One job per Playwright project instead of one job for all three (#404): `iphone` and `desktop` run the full
  # suite (the bulk of the ~350 tests) and are now the long pole at roughly half the old wall time each; the much
  # smaller `iphone-webkit` project (the demo path only) stays quick. Each shard rebuilds the app itself — no
  # cross-job cache — so this costs more total minutes than the single job did, in exchange for reliably finishing
  # instead of hitting the timeout (#404: a cancelled run at 20 min wasted the full 20 min for nothing).
  # #404 follow-up: even with the browser binary cached, `iphone-webkit` kept failing "browser install failed
  # after 2 attempts" — the cache only skips the binary download; `playwright install-deps` still apt-get installs
  # ~140 MB of OS libraries (gstreamer, codecs, fonts) from the Ubuntu mirror every run, which is what was timing
  # out, and the bounded `timeout 5m` left the child apt-get running so the retry immediately hit a held dpkg
  # lock. `iphone-webkit` now runs inside Microsoft's own Playwright image, which ships that browser and every
  # OS dependency already installed (pulled straight from MCR, not through apt) — no install-deps, no apt mirror,
  # no retry loop needed for this shard. `iphone`/`desktop` (chromium) are untouched: that shard was never the
  # one timing out, and keeping it on the bare runner avoids the extra minutes a container pull would add there.
  # The suite kept growing past this: `iphone`/`desktop` were at ~12-15 min against the 15 min timeout (one PR's
  # `iphone` shard was cancelled at the limit with every executed test passing). Each of those two chromium
  # projects was Playwright-sharded 1/2 + 2/2 (matrix `name` iphone-1/iphone-2, desktop-1/desktop-2) so the
  # ~223 tests each run split two ways instead of growing the single job past budget again; `iphone-webkit`
  # (10 tests, already quick) stays a single unsharded shard in its own container. `project`/`browser`/`shard`
  # stay separate matrix fields from the display `name` so the cache key (keyed on `browser`) and the `--project`/
  # `--shard` flags below don't have to parse the display name back apart.
  #
  # #776: the suite grew again this chunk (team-config, team-config-history, environment-setup,
  # entitled-concurrency, team-state-panel) and `desktop-1`/`desktop-2` were measured at 8-15 min against the
  # same 15 min timeout; `desktop-1` on PR #776 (run 44144498245) and `iphone-2` on a push-to-dev run
  # (44148277729, same dev head) each hit the 15 min wall and were cancelled. Per-file timing from the job logs
  # shows the 2-way split isn't even by duration even though it is by test count: Playwright's `--shard`
  # divides the discovered test list into contiguous blocks, so whichever half happens to contain
  # `team-config.e2e.ts` (~21s/test, by far the heaviest file in the suite — a11y.e2e.ts, the next biggest file
  # by test count, averages ~1.5s/test) runs 4-6 minutes longer than the other half. `iphone`/`desktop` are now
  # sharded 1/3 + 2/3 + 3/3 instead: each new shard carries roughly two-thirds of a former shard's load (~5-6
  # min of test time at this suite's current size) plus its own fixed per-shard overhead (stack startup,
  # typecheck, global setup: ~2.5-4 min), landing around 8-10 min — comfortably under 15 — and splits the
  # `team-config`-anchored cluster across more boundaries instead of keeping it whole in one shard.
  # `iphone-webkit` is unaffected (still the single unsharded demo-path project).
  e2e-shard:
    name: e2e-shard (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iphone-1
            project: iphone
            browser: chromium
            shard: '1/3'
          - name: iphone-2
            project: iphone
            browser: chromium
            shard: '2/3'
          - name: iphone-3
            project: iphone
            browser: chromium
            shard: '3/3'
          - name: desktop-1
            project: desktop
            browser: chromium
            shard: '1/3'
          - name: desktop-2
            project: desktop
            browser: chromium
            shard: '2/3'
          - name: desktop-3
            project: desktop
            browser: chromium
            shard: '3/3'
          - name: iphone-webkit
            project: iphone-webkit
            browser: webkit
            # Digest of mcr.microsoft.com/playwright:v1.63.0-noble, matching package.json's @playwright/test pin
            # exactly (the image's Playwright version must match the npm package's or the browser revision
            # mismatches). Pinned by digest, not tag, same as the action pins below.
            container: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    runs-on: ubuntu-latest
    # Empty string for the chromium shards is the documented way to make this a no-op for the rest of the matrix.
    container: ${{ matrix.container }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-npm

      - run: npm ci

      # Builds console then api (project.json dependsOn chain) — the same bundle the e2e stack and the Docker
      # image run. Done explicitly here (rather than through `nx e2e`) so this step is shared by every shard
      # while the playwright invocation below is scoped to just the one project.
      - name: Build the app under test
        run: npx nx build api

      # #404: this step alone hung twice until the job's 15 min timeout (apt mirror stalls fetching system
      # deps). The browser binary is cached by Playwright version (package-lock.json) so a cache hit only
      # needs `install-deps` (apt), not the binary download; a bounded per-attempt timeout plus one retry
      # absorbs a single slow/flaky mirror without burning the whole job timeout on a hang.
      # `iphone-webkit` skips this: it runs in the Microsoft Playwright image (see the `container:` on this
      # job above), which already has the webkit binary and every OS dep baked in — nothing to cache or
      # apt-get here, and that is the shard this step kept failing for (chromium's deps are mostly already on
      # the `ubuntu-latest` image, so its own install-deps stays fast).
      # #148: keyed on the installed @playwright/test version (read from the lockfile, which `npm ci` just
      # installed exactly), not on the whole lockfile: an unrelated dependency bump no longer drops the
      # browsers, and a hit can only hold the revision that exact version downloads. OS and arch are in the key
      # because the binaries differ per platform.
      - name: Read the installed Playwright version
        if: matrix.project != 'iphone-webkit'
        id: playwright-version
        run: |
          set -euo pipefail
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected Playwright version '${version}'"; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Cache Playwright browser binaries
        if: matrix.project != 'iphone-webkit'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}

      # #808: `install-deps`/`install --with-deps` shells out to `apt-get install`, which fails immediately
      # (rather than waiting) when another process — the runner's own unattended-upgrades, typically — holds
      # `/var/lib/dpkg/lock-frontend`. `DPkg::Lock::Timeout` makes every apt-get invocation on this runner
      # (including the one inside playwright's install-deps, which takes no apt flags of its own) wait up to
      # two minutes for the lock instead of failing on contention; the retry loop below still absorbs anything
      # that outlasts that wait or fails for an unrelated reason.
      - name: Make apt wait for the dpkg lock instead of failing on contention
        if: matrix.project != 'iphone-webkit'
        run: echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99-dpkg-lock-timeout

      - name: Install the browser
        if: matrix.project != 'iphone-webkit'
        timeout-minutes: 11
        run: |
          set -euo pipefail
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            cmd=(npx playwright install-deps ${{ matrix.browser }})
          else
            cmd=(npx playwright install --with-deps ${{ matrix.browser }})
          fi
          for attempt in 1 2; do
            echo "::group::browser install attempt ${attempt}"
            if timeout 5m "${cmd[@]}"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::browser install attempt ${attempt} timed out or failed"
          done
          echo "::error::browser install failed after 2 attempts"
          exit 1

      - name: Typecheck the suite
        run: npx tsc -p apps/console-e2e/tsconfig.json --noEmit

      - name: e2e (${{ matrix.name }})
        env:
          WRANGLER_SEND_METRICS: 'false'
        # `matrix.shard` is unset (empty string) for iphone-webkit, which runs unsharded.
        # `shell: bash` because iphone-webkit's container (mcr.microsoft.com/playwright) defaults steps to
        # `sh`, which has neither `pipefail` nor array syntax; the bare runner defaults to bash already.
        shell: bash
        run: |
          set -euo pipefail
          args=(test --config apps/console-e2e/playwright.config.ts --project=${{ matrix.project }})
          shard='${{ matrix.shard }}'
          [ -n "$shard" ] && args+=(--shard="$shard")
          npx playwright "${args[@]}"

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-e2e-report-${{ matrix.name }}
          path: |
            dist/.playwright/apps/console-e2e
            tmp/console-e2e/*/*.log
          retention-days: 7

  # Thin aggregator: `scripts/pr gate` and branch rules read the check named `e2e`, so the matrix above keeps
  # its own name (`e2e-shard`) and this job turns its result into the one check consumers already look for.
  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every e2e shard to pass
        if: needs.e2e-shard.result != 'success'
        run: |
          echo "::error::e2e-shard result was '${{ needs.e2e-shard.result }}' — see the e2e-shard matrix jobs"
          exit 1
