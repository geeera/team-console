# Security checks on every PR (plugin reference/workflow.md "Checks", ADR 0001 decision 8): secret scan, SAST,
# dependency audit. Job names are stable: `scripts/pr gate` and the security reviewer read the check runs by name.
# No secrets and no write scopes: the scanners run as plain binaries/containers, results go to the job log.
name: security

on:
  pull_request:
    branches: [dev, stage, main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SEMGREP_IMAGE: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Whole history: a secret added and removed again inside the PR is still leaked on a public repo.
          fetch-depth: 0
          persist-credentials: false

      # The binary instead of gitleaks-action: no token, no PR-comment write scope, checksum-verified.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks

      - name: Scan the git history for secrets
        # `git log --all` over the clone: every branch and tag of this repo plus this PR's merge ref (not other PRs).
        # --verbose names file, commit and rule of a finding; --redact keeps the value out of the public log.
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --verbose --no-banner --exit-code 1 .'

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry rulesets instead of `--config auto`, which requires sending metrics.
      - name: Semgrep
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src "${SEMGREP_IMAGE}" \
            semgrep scan --config p/default --config p/typescript --config p/github-actions \
            --metrics=off --error --severity ERROR

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Reads package-lock.json against the advisory database; no install needed.
      - name: npm audit
        run: npm audit --audit-level=high

  workflow-lint:
    # actionlint also runs shellcheck on every embedded `run:` script inside .github/workflows/*.yml, so this
    # one job catches both a broken workflow and a broken `run:` block before either reaches `dev` (REVIEW/QA
    # on PR #54: actionlint was passing locally but nothing ran it in CI). It does not look inside
    # .github/actions/*/action.yml (composite actions) — verified empirically, not just assumed from the
    # docs — which is why those stay small and get a manual review instead.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint

      - name: actionlint (workflows + composite actions, includes shellcheck)
        run: '"${RUNNER_TEMP}/actionlint" -color'

      - name: Install shellcheck
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      # Owner-run scripts live outside the workflow files actionlint already covers (tools/owner-setup/*.sh
      # is bash the owner runs locally with real credentials — it gets the same bar as CI's own scripts).
      - name: Shellcheck owner-run scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(tools/owner-setup/*.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::notice::no tools/owner-setup/*.sh scripts yet"
            exit 0
          fi
          "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${scripts[@]}"
