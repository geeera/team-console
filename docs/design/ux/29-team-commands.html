<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>#29 Team commands (UX wireframe)</title>
<style>
/* Low-fidelity on purpose: grey boxes, system font, no Paper Desk styling. The look is the ui-designer's job.
   Same conventions as ux/24-settings-projects.html. */
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,sans-serif;color:#222;background:#eee}
a{color:#222}
button,input,select{font:inherit}
:focus-visible{outline:3px solid #000;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.demo{background:#fff;border-bottom:1px solid #bbb;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px}
.demo b{font-size:14px}
.demo label{display:flex;gap:6px;align-items:center}
.demo p{margin:0;flex-basis:100%;color:#555}
.stage{padding:20px;display:flex;justify-content:center}
.frame{background:#fafafa;border:2px solid #999;display:flex;position:relative;overflow:hidden}
.frame.mac{width:1180px;height:720px}
.frame.phone{width:390px;height:800px;flex-direction:column;border-radius:28px}
.side{width:220px;border-right:1px solid #bbb;background:#e6e6e6;display:flex;flex-direction:column;padding:12px;gap:4px;flex:none}
.side button{width:100%;text-align:left;padding:8px;border:0;background:none;min-height:36px;cursor:pointer;display:flex;gap:6px;align-items:center}
.side [aria-current="page"]{background:#bdbdbd;font-weight:600}
.side .lbl{font-size:12px;color:#555;margin-top:10px}
.muted{color:#555;font-size:13px}
.mainwrap{flex:1;display:flex;min-width:0;min-height:0}
main{flex:1;overflow:auto;padding:20px 28px;min-width:0}
.phone main{padding:14px}
.topbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #bbb;background:#e6e6e6;min-height:52px}
.topbar h1{font-size:17px;margin:0;flex:1}
.tabbar{display:flex;border-top:1px solid #bbb;background:#e6e6e6}
.tabbar button{flex:1;min-height:52px;border:0;background:none;cursor:pointer}
.tabbar [aria-current="page"]{font-weight:700;text-decoration:underline}
h1{font-size:21px;margin:0 0 6px}
h2{font-size:16px;margin:18px 0 6px}
h3{font-size:14px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.03em;color:#444}
.btn{min-height:44px;padding:0 14px;border:1px solid #666;background:#ddd;cursor:pointer}
.btn.sm{min-height:36px;padding:0 10px}
.btn.primary{background:#555;color:#fff;border-color:#555}
.btn.link{border:0;background:none;text-decoration:underline;padding:0 4px;min-height:32px}
.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr h1{flex:1;margin:0}
.chip{display:inline-block;border:1px solid #777;padding:0 6px;font-size:12px;background:#f3f3f3}
.chip.bad{border-width:2px;font-weight:600}
.banner{border:2px solid #555;background:#fff;padding:10px 12px;margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:180px}
.box{background:#ddd;border:1px dashed #999;padding:12px;margin:10px 0;color:#444}
.list{list-style:none;margin:0;padding:0;border:1px solid #bbb;background:#fff}
.list>li{display:flex;align-items:center;gap:8px;border-top:1px solid #ddd;padding:8px 10px}
.list>li:first-child{border-top:0}
.list .grow{flex:1;min-width:0}
.list small{display:block;color:#555}
/* commands panel */
.pane{width:380px;border-left:2px solid #999;background:#fff;display:flex;flex-direction:column;flex:none;min-height:0}
.pane-h{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid #bbb;background:#f0f0f0}
.pane-h h2{margin:0;flex:1;font-size:16px}
.pane-b{overflow:auto;padding:4px 14px 20px;flex:1}
.card{border:2px solid #777;padding:10px 12px;margin:10px 0;background:#f7f7f7}
.card dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;margin:6px 0}
.card dt{color:#555}
.card dd{margin:0}
.skel{height:14px;background:repeating-linear-gradient(90deg,#ddd 0 70%,#eee 70% 100%);margin:6px 0}
.cmd{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #e3e3e3}
.cmd:first-of-type{border-top:0}
.cmd .grow{flex:1;min-width:0}
.cmd b{display:block;font-weight:600}
.cmd small{display:block;color:#555}
.why{font-size:12px;color:#333;border-left:3px solid #999;padding-left:6px;margin-top:2px}
.result{border:1px solid #333;background:#fff;padding:8px 10px;margin:10px 0;font-size:14px}
.err{font-weight:600}
.err::before{content:"! "}
.block{border:1px solid #999;background:#fff;padding:12px;margin:10px 0}
.block.warn{border:2px dashed #555}
/* dialogs and sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.phone .scrim{align-items:flex-end;padding:0}
.dialog{background:#fff;border:2px solid #333;padding:16px 18px;max-width:460px;width:100%;max-height:92%;overflow:auto}
.phone .dialog{max-width:none;border-radius:14px 14px 0 0}
.dialog h2{margin-top:0}
.dialog ul.bul{margin:6px 0 10px;padding-left:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.phone .actions{flex-direction:column-reverse}
.phone .actions .btn{width:100%}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field input,.field select{min-height:44px;padding:0 10px;border:1px solid #666;background:#fff}
fieldset{border:1px solid #bbb;margin:10px 0;padding:6px 10px 10px}
legend{font-weight:600;padding:0 4px}
fieldset label{display:flex;gap:8px;align-items:flex-start;min-height:36px;padding:4px 0}
.hint{color:#555;font-size:13px}
.diff{background:#f0f0f0;border-left:3px solid #555;padding:6px 10px;margin:10px 0}
.sheet{background:#fff;border-top:2px solid #333;width:100%;height:88%;display:flex;flex-direction:column;border-radius:14px 14px 0 0}
.tag{font-size:12px;border:1px solid #999;padding:0 5px;background:#f3f3f3;margin-right:4px}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;max-width:90%;z-index:6}
.mac .toast{bottom:24px}
.note{font-size:12px;color:#666;border:1px dotted #999;padding:4px 8px;margin:8px 0;background:#fff}
@media (prefers-reduced-motion:no-preference){.toast,.dialog,.sheet{animation:fade .18s}}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div class="demo" role="region" aria-label="Wireframe controls">
  <b>#29 Team commands, low-fidelity wireframe</b>
  <label>View <select id="c-vp"><option value="mac">Mac</option><option value="phone">iPhone</option></select></label>
  <label>Language <select id="c-lang"><option value="ru">ru</option><option value="en">en</option></select></label>
  <label>Data <select id="c-data">
    <option value="loaded">loaded</option><option value="loading">loading</option><option value="error">status load error</option>
    <option value="offline">offline</option><option value="noperm">console token cannot write</option><option value="notoken">no routine token</option>
  </select></label>
  <label>Project <select id="c-proj"><option value="running">running</option><option value="owner">paused by owner</option><option value="team">paused by the team (3 failed runs)</option></select></label>
  <label><input type="checkbox" id="c-overlap"> development run in progress</label>
  <label><input type="checkbox" id="c-freeze"> freeze days</label>
  <label><input type="checkbox" id="c-nosprint"> no current sprint</label>
  <label>Next write <select id="c-res">
    <option value="ok">succeeds</option><option value="error">GitHub / trigger unavailable</option>
    <option value="rate">rate limit</option><option value="conflict">conflict (already changed / partial)</option><option value="timeout">no answer (unknown result)</option>
  </select></label>
  <button type="button" class="btn sm" id="c-reset">Reset</button>
  <p>Mock time: Tue 29 Sep 2026, 14:05 Kyiv. All projects share one mock state; the names change. Mac: click inside the window, then <b>K</b> opens commands (on "All projects", for the focused row).</p>
</div>
<div class="stage"><div id="app"></div></div>
<div class="sr-only" aria-live="polite" id="live"></div>

  const rows = S.issues.filter((i) => i.sprint === 'cur').map((i) => `<li><span class="grow">#${i.n} ${esc(title(i))}<small>${t(`tier.${i.tier}`)}${i.sev ? ' · ' + t(`sev.${i.sev}`) : ''}</small></span><button type="button" class="btn sm" id="edit-${i.n}" data-act="edit" data-n="${i.n}" aria-label="${esc(t('board.editAria', { n: i.n }))}" aria-haspopup="dialog" ${blocked('write') ? 'aria-disabled="true"' : ''}>${t('board.edit')}</button></li>`).join('');
  const head = S.vp === 'mac' ? `<div class="hdr"><h1>${p.slug}</h1><button type="button" class="btn" id="open-panel" data-act="panel" aria-expanded="${!!S.panel}" aria-controls="panel" aria-keyshortcuts="K">${t('space.commands')} <span class="muted">K</span></button></div>` : '';

/* ---------- dialogs ---------- */
function actions(ok, okDisabled) {
  return `<div class="actions"><button type="button" class="btn" data-act="dlg-cancel" id="dlg-cancel">${t('c.cancel')}</button>
    <button type="button" class="btn primary" data-act="dlg-ok" id="dlg-ok" ${S.busy || okDisabled ? 'aria-disabled="true"' : ''}>${S.busy ? t('c.sending') : S.err ? t('c.retry') : ok}</button></div>`;
}
const errBlock = () => (S.err ? `<p class="err" role="alert" id="dlg-err">${S.err}</p>` : '');

  const d = S.dlg; const p = P(); let h = '';

  if (d.type === 'resume') h = `<h2 id="dlg-h" tabindex="-1">${t('r.t', { name: p.slug })}</h2><p>${S.proj === 'team' ? `<b>${t('r.bTeam')}</b> <a href="#">${t('banner.log')}</a>` : t('r.b')}</p>${errBlock()}${actions(t('r.ok'))}`;

    h = `<h2 id="dlg-h" tabindex="-1">${t('run.t', { slot: t(`slot.${d.slot}L`) })}</h2><p>${body}</p><p>${t('run.quota')}</p>${errBlock()}${actions(t('run.ok'))}`;
  }

    else if (S.next && v >= S.next) { msg = `<p class="err" id="f-date-e">${t('d.errNext', { sprint: sprintName(p.sprint + 1), date: fDate(S.next) })}</p>`; bad = true; }
    else if (addDays(v, -2) <= TODAY) msg = `<p class="block warn" id="f-date-e">${t('d.warnFreeze')}</p>`;

      <div class="field"><label for="f-date">${t('d.f')}</label><input type="date" id="f-date" min="${TODAY}" value="${v}" aria-describedby="f-date-h${msg ? ' f-date-e' : ''}" ${bad ? 'aria-invalid="true"' : ''}><span class="hint" id="f-date-h">${t('d.hint', { freeze: freeze(v) })}</span></div>
      ${msg}${errBlock()}${actions(same ? t('d.same') : t('d.ok', { date: fDate(v) }), bad || same)}`;

      <p>${S.nosprint ? t('n.now', { sprint: sprintName(p.sprint + 1) }) : t('n.after', { sprint: sprintName(p.sprint + 1), cur: sprintName(p.sprint), date: fDate(S.demo) })}</p>
      <div class="field"><label for="f-next">${t('n.f', { sprint: sprintName(p.sprint + 1) })}</label><input type="date" id="f-next" min="${addDays(base, 1)}" value="${v}" aria-describedby="f-next-h${bad ? ' f-next-e' : ''}" ${bad ? 'aria-invalid="true"' : ''}><span class="hint" id="f-next-h">${t('d.hint', { freeze: freeze(v) })}</span></div>
      ${bad ? `<p class="err" id="f-next-e">${t('n.errBefore', { sprint: sprintName(p.sprint + 1), date: fDate(base) })}</p>` : ''}${errBlock()}${actions(t('n.ok', { sprint: sprintName(p.sprint + 1) }), bad)}`;
  }
  if (d.type === 'pick') {
    const q = (S.q || '').toLowerCase();
    const list = S.issues.filter((i) => !q || String(i.n).includes(q.replace('#', '')) || title(i).toLowerCase().includes(q));
    h = `<h2 id="dlg-h" tabindex="-1">${t('pick.t')}</h2><div class="field"><label for="f-q">${t('pick.f')}</label><input type="search" id="f-q" value="${esc(S.q)}" autocomplete="off" aria-controls="pick-list"></div>
      <ul class="list" id="pick-list" aria-live="polite">${S.issues.length === 0 ? `<li>${t('pick.empty')}</li>` : list.length ? list.map((i) => `<li><button type="button" class="btn link grow" style="text-align:left" data-act="edit" data-n="${i.n}" id="pick-${i.n}">#${i.n} ${esc(title(i))}</button></li>`).join('') : `<li>${t('pick.none', { q: S.q })}</li>`}</ul>
      <div class="actions"><button type="button" class="btn" data-act="dlg-cancel" id="dlg-cancel">${t('c.cancel')}</button></div>`;
  }
  if (d.type === 'edit') {
    const i = S.issues.find((x) => x.n === d.n); const v = d.v;
    const ch = [];
    const sprintLabel = (s) => s === 'cur' ? sprintName(p.sprint) : s === 'next' ? sprintName(p.sprint + 1) : t('e.backlog');
    if (v.sprint !== i.sprint) ch.push(`${S.lang === 'ru' ? 'спринт' : 'sprint'} ${sprintLabel(i.sprint)} → ${sprintLabel(v.sprint)}`);
    if (v.tier !== i.tier) ch.push(`${S.lang === 'ru' ? 'уровень' : 'tier'} ${t('tier.' + i.tier).toLowerCase()} → ${t('tier.' + v.tier).toLowerCase()}`);
    if (i.sev && v.sev !== i.sev) ch.push(`${S.lang === 'ru' ? 'важность' : 'severity'} ${t('sev.' + i.sev).toLowerCase()} → ${t('sev.' + v.sev).toLowerCase()}`);
    d.changes = ch.join('; ');

    h = `<h2 id="dlg-h" tabindex="-1">${t('e.t', { n: i.n, title: title(i) })}</h2>
      <div class="field"><label for="f-sprint">${t('e.sprint')}</label><select id="f-sprint" data-field="sprint">
        <option value="cur" ${v.sprint === 'cur' ? 'selected' : ''}>${t('e.cur', { sprint: sprintName(p.sprint), date: fDate(S.demo) })}</option>
        ${S.next ? `<option value="next" ${v.sprint === 'next' ? 'selected' : ''}>${t('e.next', { sprint: sprintName(p.sprint + 1), date: fDate(S.next) })}</option>` : ''}
        <option value="none" ${v.sprint === 'none' ? 'selected' : ''}>${t('e.backlog')}</option></select></div>
      <fieldset aria-describedby="tier-h"><legend>${t('e.tier')}</legend>${['light', 'standard', 'heavy'].map((x) => radio('tier', x, v.tier)).join('')}<span class="hint" id="tier-h">${t('e.tierHint')}</span></fieldset>
      ${i.sev ? `<fieldset aria-describedby="sev-h"><legend>${t('e.sev')}</legend>${['critical', 'high', 'medium', 'low'].map((x) => radio('sev', x, v.sev)).join('')}<span class="hint" id="sev-h">${t('e.sevHint')}</span></fieldset>` : `<p class="hint">${t('e.order')}</p>`}
      <p class="diff" id="e-diff" aria-live="polite">${ch.length ? t('e.diff', { list: d.changes }) + ' ' + t('c.owner') : t('e.none')}</p>

      <fieldset><legend class="sr-only">${t('a.t')}</legend>${safe.map((q) => `<label><input type="checkbox" data-q="${q.n}" ${sel.includes(q.n) ? 'checked' : ''}><span>${d.scope === 'all' ? `<span class="tag">${q.p}</span>` : ''}#${q.n} ${esc(title(q))}<br><small class="muted">${t('needs.rec', { c: S.lang === 'ru' ? q.recText : q.recEn })}</small></span></label>`).join('')}</fieldset>
      ${un.length ? `<details><summary>${t('a.excl', { n: un.length })}</summary><ul>${un.map((q) => `<li>${d.scope === 'all' ? `<span class="tag">${q.p}</span>` : ''}#${q.n} ${esc(title(q))} — ${why(q)}</li>`).join('')}</ul></details>` : ''}
      <p class="hint">${t('a.each')}</p>${n ? '' : `<p class="hint" id="a-zero">${t('a.zero')}</p>`}${errBlock()}${actions(t('a.ok', { n }), !n)}`;
  }
  if (d.type === 'snooze') {
    const opt = (v) => `<label><input type="radio" name="when" value="${v}" ${d.when === v ? 'checked' : ''} data-field="when"> ${t('s.' + v)}</label>`;
    h = `<h2 id="dlg-h" tabindex="-1">${t('s.t', { name: p.slug })}</h2><fieldset><legend>${t('s.when')}</legend>${['hour', 'morning', 'week', 'forever'].map(opt).join('')}</fieldset>
      <label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="f-urgent" checked> <span>${t('s.urgent')}</span></label>${errBlock()}${actions(t('s.ok'))}`;
  }
  return `<div class="scrim" data-act="scrim"><div class="dialog" role="${d.type === 'pick' || d.type === 'edit' || d.type === 'snooze' ? 'dialog' : 'alertdialog'}" aria-modal="true" aria-labelledby="dlg-h" ${S.err ? 'aria-describedby="dlg-err"' : ''}>${h}</div></div>`;
}

/* ---------- frame ---------- */
function render() {
  document.documentElement.lang = S.lang;
  const app = $('#app'); const mac = S.vp === 'mac';
  let main = S.view === 'space' ? spaceHTML() : S.view === 'all' ? allHTML() : needsHTML();
  let h = '';
  const nav = (v, label) => `<button type="button" data-act="view" data-view="${v}" ${S.view === v ? 'aria-current="page"' : ''}>${label}</button>`;
  if (mac) {
    h = `<nav class="side" aria-label="${t('nav.projects')}">${nav('needs', t('nav.needs'))}${nav('all', t('nav.all'))}<div class="lbl">${t('nav.projects')}</div>
      ${PROJECTS.map((p) => `<button type="button" data-act="open" data-slug="${p.slug}" ${S.view === 'space' && S.project === p.slug ? 'aria-current="page"' : ''}>${p.slug}${S.snooze ? ' <span class="muted" aria-label="' + t('all.snoozed') + '">(z)</span>' : ''}</button>`).join('')}</nav>
      <div class="mainwrap" data-behind><main>${main}</main>${S.panel ? `<aside class="pane" id="panel" aria-labelledby="panel-h">${panelHTML()}</aside>` : ''}</div>`;
  } else {
    const inSpace = S.view === 'space';
    h = `<div class="topbar" data-behind><button type="button" data-act="view" data-view="all" aria-label="${t('nav.all')}">☰</button><h1>${inSpace ? S.project : S.view === 'all' ? t('nav.all') : t('nav.needs')}</h1>
      ${inSpace ? `<button type="button" class="btn sm" id="open-panel" data-act="panel" aria-haspopup="dialog">${t('space.commands')}</button>` : ''}</div>
      <main data-behind>${main}</main>
      <nav class="tabbar" data-behind aria-label="${t('nav.projects')}"><button type="button" data-act="tab" data-tab="chat" ${inSpace && S.tab === 'chat' ? 'aria-current="page"' : ''}>${t('tab.chat')}</button><button type="button" data-act="tab" data-tab="board" ${inSpace && S.tab === 'board' ? 'aria-current="page"' : ''}>${t('tab.board')}</button><button type="button" data-act="view" data-view="needs" ${S.view === 'needs' ? 'aria-current="page"' : ''}>${t('nav.needs')}</button></nav>
      ${S.panel ? `<div class="scrim" data-act="scrim-panel"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="panel-h" id="panel">${panelHTML()}</div></div>` : ''}`;
  }
  if (S.dlg) h += dialogHTML();
  if (S.toast) h += `<div class="toast">${S.toast}</div>`;
  app.innerHTML = `<div class="frame ${S.vp}" tabindex="-1" id="frame">${h}</div>`;
  // modality: everything behind the top-most modal is inert
  const frame = $('#frame');
  if (S.dlg) [...frame.children].forEach((c) => { if (!c.classList.contains('scrim') || c.querySelector('.sheet')) c.inert = true; });
  if (S.dlg && !mac && S.panel) frame.querySelectorAll('.scrim')[0].inert = true;
  if (!S.dlg && S.panel && !mac) frame.querySelectorAll('[data-behind]').forEach((n) => { n.inert = true; });
  if (S.focusTo) { const el = $('#' + S.focusTo) || (S.opener && $('#' + S.opener)) || frame; S.focusTo = null; el.focus(); }
}

/* ---------- behaviour ---------- */
function openDlg(dlg, opener) { S.dlg = dlg; S.err = null; S.busy = false; S.opener = opener; S.focusTo = dlg.type === 'pick' ? 'f-q' : 'dlg-h'; render(); }
function closeDlg(focus) { S.dlg = null; S.err = null; S.busy = false; S.focusTo = focus || S.opener; render(); }
function done(html, focus) {
  const slug = P().slug;
  S.result = { slug, html };
  if (!S.panel) { S.toast = html; setTimeout(() => { S.toast = null; render(); }, 4000); }
  announce(html); closeDlg(focus);
}
function confirm() {
  const d = S.dlg; if (S.busy) return;
  if (S.data === 'offline') { S.err = t('err.offline'); render(); return; }
  S.busy = true; render();
  setTimeout(() => {
    S.busy = false; const res = S.res; const p = P(); const now = '14:05';
    const fail = (msg) => { S.err = msg; S.focusTo = 'dlg-ok'; render(); announce(msg); };
    if (d.type === 'snooze' || d.type === 'pick') res === 'error' ? fail(t('err.github')) : (() => { const u = d.when === 'forever' ? null : t('s.until' + d.when[0].toUpperCase() + d.when.slice(1)); S.snooze = u || (S.lang === 'ru' ? 'ручного включения' : 'turned on'); done(u ? t('s.done', { name: p.slug, until: u }) : t('s.doneForever', { name: p.slug }), 'cmd-unsnooze'); })();
    else if (res === 'error') fail(d.type === 'run' ? t('run.err') : t('err.github'));
    else if (res === 'rate') fail(d.type === 'run' ? t('run.rate') : t('err.rate'));
    else if (res === 'timeout' && d.type === 'run') { S.run[d.slot] = 'unknown'; done(t('run.timeout'), 'result'); }
    else if (res === 'conflict') {
      if (d.type === 'pause') { S.proj = 'owner'; done(t('p.conflict', { name: p.slug }), 'cmd-resume'); }
      else if (d.type === 'resume') { S.proj = 'running'; done(t('r.conflict', { name: p.slug }), 'cmd-pause'); }
      else if (d.type === 'run') fail(t('run.overlap', { slot: t('slot.' + d.slot) }));
      else if (d.type === 'edit') { const i = S.issues.find((x) => x.n === d.n); i.tier = 'heavy'; d.v = { ...d.v, tier: 'heavy' }; fail(t('e.conflict')); }
      else if (d.type === 'approve') { S.answered.push(...d.sel.filter((n) => n !== 58)); d.sel = [58]; fail(`${t('a.partial')}`); }
      else fail(t('err.github'));
    } else {
      if (d.type === 'pause') { S.proj = 'owner'; S.pausedAt = now; done(t('p.done', { name: p.slug, time: now }), 'cmd-resume'); }
      if (d.type === 'resume') { S.proj = 'running'; done(t('r.done', { name: p.slug, time: now }), 'cmd-pause'); }
      if (d.type === 'run') { S.run[d.slot] = 'requested'; done(`${t('run.done', { slot: t('slot.' + d.slot), time: now })} <a href="#">${t('st.log')} ↗</a>`, 'result'); }
      if (d.type === 'demo') { S.demo = d.value; done(t('d.done', { sprint: sprintName(p.sprint), date: fDate(d.value) }), 'cmd-demo'); }
      if (d.type === 'next') { S.next = d.value || addDays(S.nosprint ? TODAY : S.demo, 14); done(t('n.done', { sprint: sprintName(p.sprint + 1), date: fDate(S.next) }), 'result'); }
      if (d.type === 'edit') { const i = S.issues.find((x) => x.n === d.n); Object.assign(i, d.v); done(t('e.done', { n: d.n, list: d.changes }), S.opener); }
      if (d.type === 'approve') { const n = d.sel.length; S.answered.push(...d.sel); done(t('a.done', { n }), S.view === 'needs' ? 'frame' : 'result'); }
    }
  }, 700);
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || !$('#app').contains(el)) return;
  const act = el.dataset.act;
  if (act === 'scrim' && e.target !== el) return;
  if (act === 'scrim-panel' && e.target !== el) return;
  if (el.getAttribute('aria-disabled') === 'true') { e.preventDefault(); const w = el.getAttribute('aria-describedby'); if (w && $('#' + w)) announce($('#' + w).textContent); return; }
  e.preventDefault();
  const id = el.id;
  switch (act) {
    case 'view': S.view = el.dataset.view; S.panel = mac() ? S.panel : null; render(); break;
    case 'tab': S.view = 'space'; S.tab = el.dataset.tab; render(); break;
    case 'open': S.view = 'space'; S.project = el.dataset.slug; S.panel = null; render(); break;
    case 'panel': S.panel = el.dataset.slug || S.project; S.panelOpener = id; S.focusTo = 'panel-h'; render(); break;
    case 'panel-close': case 'scrim-panel': closePanel(); break;
    case 'st-retry': S.data = 'loading'; $('#c-data').value = 'loading'; render(); setTimeout(() => { S.data = 'loaded'; $('#c-data').value = 'loaded'; S.focusTo = 'st-h'; render(); announce(t('st.updated', { time: '14:05' })); }, 900); break;
    case 'cmd-pause': openDlg({ type: 'pause' }, id); break;
    case 'cmd-resume': openDlg({ type: 'resume' }, id); break;
    case 'run': openDlg({ type: 'run', slot: el.dataset.slot }, id); break;
    case 'cmd-demo': openDlg({ type: 'demo', value: S.demo }, id); break;
    case 'cmd-next': openDlg({ type: 'next' }, id); break;
    case 'cmd-edit': S.q = ''; openDlg({ type: 'pick' }, id); break;
    case 'edit': { const i = S.issues.find((x) => x.n === +el.dataset.n); const op = S.dlg ? S.opener : id; openDlg({ type: 'edit', n: i.n, v: { sprint: i.sprint, tier: i.tier, sev: i.sev } }, op); break; }
    case 'cmd-approve': { const scope = el.dataset.scope || 'project'; const list = safeQs(scope === 'all' ? null : P().slug); openDlg({ type: 'approve', scope, sel: list.map((q) => q.n) }, id); break; }
    case 'cmd-snooze': openDlg({ type: 'snooze', when: 'morning' }, id); break;
    case 'cmd-unsnooze': S.snooze = null; S.result = { slug: P().slug, html: t('s.on', { name: P().slug }) }; announce(S.result.html); S.focusTo = 'cmd-snooze'; render(); break;
    case 'dlg-cancel': case 'scrim': closeDlg(); break;

  }
});
const mac = () => S.vp === 'mac';
function closePanel() { const f = S.panelOpener; S.panel = null; S.result = null; S.focusTo = f; render(); }
document.addEventListener('input', (e) => {
  if (!S.dlg) return; const el = e.target;
  if (el.id === 'f-reason') { S.dlg.reason = el.value; return; }
  if (el.id === 'f-q') { S.q = el.value; render(); const f = $('#f-q'); f.focus(); f.setSelectionRange(f.value.length, f.value.length); return; }
  if (el.id === 'f-date') { S.dlg.value = el.value; render(); $('#f-date').focus(); return; }
  if (el.id === 'f-next') { S.dlg.value = el.value; render(); $('#f-next').focus(); return; }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (S.dlg && el.dataset.field) { const f = el.dataset.field; if (f === 'when') S.dlg.when = el.value; else S.dlg.v[f] = el.value; const id = el.id || null; render(); (id ? $('#' + id) : $(`[data-field="${f}"][value="${el.value}"]`)).focus(); return; }
  if (S.dlg && el.dataset.q) { const n = +el.dataset.q; S.dlg.sel = el.checked ? [...S.dlg.sel, n] : S.dlg.sel.filter((x) => x !== n); render(); $(`[data-q="${n}"]`).focus(); return; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.dlg && !S.busy) { e.preventDefault(); closeDlg(); } else if (S.panel) { e.preventDefault(); closePanel(); } return; }
  if (e.key.toLowerCase() === 'k' && mac() && !S.dlg && !e.metaKey && !e.ctrlKey && $('#app').contains(document.activeElement) && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
    const row = document.activeElement.closest('[data-row]');
    if (S.view === 'space' || row) { e.preventDefault(); S.panel = row ? row.dataset.row : S.project; S.panelOpener = document.activeElement.id || 'open-panel'; S.focusTo = 'panel-h'; render(); }
  }
});
const bind = (id, key, map = (x) => x) => $(id).addEventListener('change', (e) => { S[key] = map(e.target.type === 'checkbox' ? e.target.checked : e.target.value); S.result = null; render(); });
bind('#c-vp', 'vp'); bind('#c-lang', 'lang'); bind('#c-data', 'data'); bind('#c-proj', 'proj'); bind('#c-overlap', 'overlap'); bind('#c-freeze', 'freeze'); bind('#c-nosprint', 'nosprint'); bind('#c-res', 'res');
$('#c-reset').addEventListener('click', () => { S = init(); ['#c-data', '#c-proj', '#c-res'].forEach((s) => { $(s).selectedIndex = 0; }); ['#c-overlap', '#c-freeze', '#c-nosprint'].forEach((s) => { $(s).checked = false; }); $('#c-vp').value = S.vp; $('#c-lang').value = 'ru'; render(); });
$('#c-vp').value = S.vp;
render();
</script>
