<div class="tc-page settings">
  <h1 #heading tcSrOnlyOnPhone class="tc-page__title settings__title" tabindex="-1">{{ 'settings.title' | transloco }}</h1>

  <section class="settings__section" aria-labelledby="settings-gh">
    <h2 id="settings-gh" class="settings__section-title">{{ 'settings.gh.title' | transloco }}</h2>
    <tc-github-connection-card [outcome]="outcome()" />
  </section>

  <section class="settings__section" aria-labelledby="settings-push" data-testid="push-section">
    <div>
      <h2 #pushHeading id="settings-push" class="settings__section-title" tabindex="-1">
        {{ 'push.title' | transloco }}
      </h2>
      <p class="settings__lead">{{ 'push.lead' | transloco }}</p>
    </div>
    <tc-push-settings-card />
  </section>

  <section class="settings__section" aria-labelledby="settings-lang">
    <h2 id="settings-lang" class="settings__section-title">{{ 'settings.language' | transloco }}</h2>
    <div>
      <button
        tc-button
        type="button"
        data-testid="switch-lang"
        [attr.lang]="otherLang()"
        (click)="switchLang()"
      >
        {{ 'settings.switchLang' | transloco }}
      </button>
    </div>
  </section>

  <p class="settings__version">
    {{ appInfo.name() }} · {{ appInfo.version() }} ·
    <span data-testid="app-built-at">{{ appInfo.builtAt() }}</span>
  </p>
</div>
