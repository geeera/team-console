<ng-template #content>
  <span class="tc-list-row__leading"><ng-content select="[tc-row-leading]" /></span>
  <span class="tc-list-row__text">
    <span class="tc-list-row__title"><ng-content select="[tc-row-title]" /></span>
    <span class="tc-list-row__subtitle"><ng-content select="[tc-row-subtitle]" /></span>
  </span>
  <span class="tc-list-row__trailing"><ng-content select="[tc-row-trailing]" /></span>
  <ng-content />
</ng-template>

@if (href()) {
<a
  class="tc-list-row__surface"
  [attr.href]="href()"
  [attr.target]="external() ? '_blank' : null"
  [attr.rel]="external() ? 'noopener noreferrer' : null"
  [attr.aria-current]="current() ? 'true' : null"
>
  <ng-container *ngTemplateOutlet="content" />
</a>
} @else if (button()) {
<button
  class="tc-list-row__surface"
  type="button"
  [disabled]="disabled()"
  [attr.aria-current]="current() ? 'true' : null"
>
  <ng-container *ngTemplateOutlet="content" />
</button>
} @else {
<div class="tc-list-row__surface" [attr.aria-current]="current() ? 'true' : null">
  <ng-container *ngTemplateOutlet="content" />
</div>
}
<ng-content select="[tc-row-action]" />
