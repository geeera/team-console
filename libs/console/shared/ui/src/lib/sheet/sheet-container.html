@if (frame.presentation === 'sheet' && frame.size !== 'full') {
<div class="tc-sheet__grab" aria-hidden="true"></div>
}
<!-- A div, not <header>: two stacked sheets (a confirmation over a panel) would give two banner landmarks. -->
<div class="tc-sheet__head">
  <h2 class="tc-sheet__title" [id]="frame.titleId" tabindex="-1">{{ frame.title }}</h2>
  <button
    tc-icon-button
    type="button"
    class="tc-sheet__close"
    [attr.aria-label]="'ui.close' | transloco"
    (click)="close()"
  >
    <tc-icon name="x" size="lg" />
  </button>
</div>
<!-- A body that scrolls is a focusable region named by the title, so a keyboard can scroll it (axe
     scrollable-region-focusable); one that fits adds no tab stop. -->
<div
  #body
  class="tc-sheet__body"
  [attr.tabindex]="scrollable() ? 0 : null"
  [attr.role]="scrollable() ? 'region' : null"
  [attr.aria-labelledby]="scrollable() ? frame.titleId : null"
>
  <div #content class="tc-sheet__content"><ng-template cdkPortalOutlet /></div>
</div>
@if (footer.template(); as actions) {
<div class="tc-sheet__foot"><ng-container *ngTemplateOutlet="actions" /></div>
}
